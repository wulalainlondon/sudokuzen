                    preLevelBestRecordEl.textContent = `最佳紀錄：${formatSeconds(time)} 星級：${'★'.repeat(stars)}`;
                }
                preLevelBestRecordEl.classList.add('has-record');

                // Show historical replay button if available
                if (record.replayHistory && record.replayHistory.length > 0) {
                    preLevelReplayBtn.style.display = 'block';
                    preLevelReplayBtn.onclick = () => openHistoricalReplay(levelId, record.replayHistory);
                } else {
                    preLevelReplayBtn.style.display = 'none';
                }
            } else {
                preLevelBestRecordEl.textContent = '尚無通關紀錄';
                preLevelBestRecordEl.classList.remove('has-record');
                preLevelReplayBtn.style.display = 'none';
            }

            // Load leaderboard
            preLevelLeaderboardEl.textContent = '載入中...';
            loadPreLevelLeaderboard(levelId);

            // Show modal
            preLevelModalEl.style.display = 'flex';
        }

        function hidePreLevelModal() {
            preLevelModalEl.style.display = 'none';
            pendingLevelId = null;
        }

        function startLevelFromModal() {
            if (pendingLevelId === null) return;
            const levelId = pendingLevelId;
            hidePreLevelModal();
            document.getElementById('level-screen').style.display = 'none';
            initGame(levelId);
        }

        async function loadPreLevelLeaderboard(levelId) {
            if (!firebaseReady) {
                preLevelLeaderboardEl.textContent = '尚未啟用 Firebase 排行。';
                return;
            }
            try {
                const snap = await db.collection('level_first_clears')
                    .doc(String(levelId))
                    .collection('players')
                    .orderBy('firstTimeSec', 'asc')
                    .limit(3)
                    .get();
                const rows = snap.docs.map(d => d.data());
                if (!rows.length) {
                    preLevelLeaderboardEl.textContent = '尚無玩家首通紀錄';
                } else {
                    preLevelLeaderboardEl.innerHTML = rows.map((r, i) => {
                        const timeStr = formatSeconds(r.firstTimeSec);
                        if (isSpeedrunMode) {
                            return `${i + 1}. ${r.alias}  ${timeStr} (經典)`;
                        }
                        return `${i + 1}. ${r.alias}  ${timeStr}  ${'★'.repeat(r.firstStars)}`;
                    }).join('<br>');
                }
            } catch (e) {
                console.warn('load pre-level leaderboard failed:', e);
                preLevelLeaderboardEl.textContent = '載入失敗';
            }
        }

        // Bind modal button events
        if (preLevelStartBtn) preLevelStartBtn.onclick = startLevelFromModal;
        if (preLevelBackBtn) preLevelBackBtn.onclick = hidePreLevelModal;
        if (preLevelModalEl) {
            preLevelModalEl.addEventListener('click', (e) => {
                if (e.target === preLevelModalEl) hidePreLevelModal();
            });
        }

        function toggleSpeedrunMode() {
            isSpeedrunMode = !isSpeedrunMode;
            localStorage.setItem('sudoku_speedrun', isSpeedrunMode);
            updateSpeedrunToggleUI();
            renderLevelGrid();
            if (isSpeedrunMode) showFeedback('已切換至純粹競速模式 ⚡', 'success');
        }

        function updateSpeedrunToggleUI() {
            const btn = document.getElementById('speedrun-toggle-btn');
            if (btn) {
                if (isSpeedrunMode) {
                    btn.style.filter = 'grayscale(0)';
                    btn.style.opacity = '1';
                    btn.style.textShadow = '0 0 10px rgba(255, 193, 7, 0.6)';
                } else {
                    btn.style.filter = 'grayscale(1)';
                    btn.style.opacity = '0.4';
                    btn.style.textShadow = 'none';
                }
            }
        }

        function showLevelScreen() {
            updateSpeedrunToggleUI();
            document.getElementById('level-screen').style.display = 'flex';
            document.querySelector('.game-container').style.display = 'none';
            clearInterval(timerInterval);
            overlay.style.display = 'none';
            closeReplayModal();
            hidePreLevelModal();
            switchTab(currentTab);
        }

        function switchTab(tab) {
            currentTab = tab;
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach((b, i) => b.classList.toggle('active', i === tab));
            renderLevelGrid();
        }

        function getFilteredLevels() {
            return levels.filter(l => l.stars === currentTab);
        }

        function syncLevelCardSize() {
            const items = document.querySelectorAll('#level-list .level-item');
            items.forEach((item) => {
                const w = item.getBoundingClientRect().width;
                if (w > 0) item.style.height = `${w}px`;
            });
        }

        function renderLevelGrid() {
            const recordsKey = isSpeedrunMode ? 'sudoku_speed_records' : 'sudoku_records';
            const records = JSON.parse(localStorage.getItem(recordsKey) || '{}');
            const list = document.getElementById('level-list');
            list.innerHTML = '';

            const filtered = getFilteredLevels().filter(l => !l.hidden);
            filtered.forEach((l, index) => {
                const record = records[l.id];
                // 向下相容：處理舊的數字格式
                let bestTime = null;
                let bestStars = 0;
                let submissions = 0;

                if (record) {
                    if (typeof record === 'number') {
                        // 舊格式：僅紀錄時間
                        bestTime = record;
                        bestStars = 1;
                    } else {
                        bestTime = record.time;
                        bestStars = record.stars || 1;
                        if (isSpeedrunMode) submissions = record.submissions || 1;
                    }
                }

                const item = document.createElement('div');
                item.className = `level-item ${bestTime !== null ? 'completed' : ''}`;
                item.onclick = () => showPreLevelModal(l.id);

                const hasRecord = bestTime !== null;
                const timeStr = hasRecord
                    ? `${Math.floor(bestTime / 60)}:${(bestTime % 60).toString().padStart(2, '0')}`
                    : '--:--';
                const statsClass = hasRecord ? 'level-stats' : 'level-stats is-empty';

                let starsClass, starsText;
                if (isSpeedrunMode) {
                    starsClass = hasRecord ? 'level-stars speedrun-stars' : 'level-stars is-empty';
                    starsText = hasRecord ? `⚡ ${submissions}次提交` : '⚡ 未通關';
                } else {
                    starsClass = bestStars > 0 ? 'level-stars' : 'level-stars is-empty';
                    starsText = bestStars > 0
                        ? '★'.repeat(bestStars) + '<span class="empty-star">' + '☆'.repeat(3 - bestStars) + '</span>'
                        : '☆☆☆';
                }

                item.innerHTML = `
                    <div class="level-num">${l.displayName}</div>
                    <div class="${starsClass}">${starsText}</div>
                    <div class="${statsClass}">${timeStr}</div>
                `;
                list.appendChild(item);
            });
            requestAnimationFrame(syncLevelCardSize);
        }

        function hashStringToSeed(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

        function startRandomLevel() {
            const pool = getFilteredLevels();
            if (!pool.length) return;
            const idx = Math.floor(Math.random() * pool.length);
            showPreLevelModal(pool[idx].id);
        }

        function startDailyRandom() {
            const pool = getFilteredLevels();
            if (!pool.length) return;
            const now = new Date();
            const key = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}-tab${currentTab}`;
            const seed = hashStringToSeed(key);
            const idx = seed % pool.length;
            showPreLevelModal(pool[idx].id);
        }

        function buildMidMasterPool() {
            // 進階(無我) ~ 大師(空鏡) 之間：無我(3)、本源(4)、寂滅(5)
            const eligibleStars = new Set([3, 4, 5]);
            const eligible = levels.filter(l => eligibleStars.has(l.stars));
            if (!eligible.length) return [];
            const seed = hashStringToSeed('mid_master_pool_v1');
            const scored = eligible.map(l => ({
                level: l,
                score: hashStringToSeed(`${seed}-${l.id}`)
            }));
            scored.sort((a, b) => a.score - b.score);
            return scored.slice(0, 100).map(s => s.level);
        }

        function startPoolRandom() {
            if (!midPoolLevels.length) {
                showFeedback('今日隨機題庫載入失敗，請稍後重試', 'error');
                return;
            }

            const records = JSON.parse(localStorage.getItem('sudoku_records') || '{}');
            // 過濾出尚未通關的關卡
            const unplayedPool = midPoolLevels.filter(l => !records[l.id]);

            let pool = unplayedPool;
            if (!unplayedPool.length) {
                // 防呆：如果題庫全刷完了，就退回從全部裡面抽，並給予鼓勵
                pool = midPoolLevels;
                showFeedback('太厲害了！您已通關隨機題庫所有關卡，為您隨機抽取一題挑戰！', 'success');
            }

            const idx = Math.floor(Math.random() * pool.length);
            showPreLevelModal(pool[idx].id);
        }

        function selectCell(idx) {
            selectedIdx = idx;
            const selectedVal = cellsData[idx].value;
            const row = Math.floor(idx / 9), col = idx % 9;
            const box = Math.floor(row / 3) * 3 + Math.floor(col / 3);

            Array.from(gridEl.children).forEach((c, i) => {
                c.classList.remove('selected', 'related', 'match');
                const r = Math.floor(i / 9), l = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(l / 3);
                const val = cellsData[i].value;

                if (i === idx) {
                    c.classList.add('selected');
                } else {
                    if (r === row || l === col || b === box) {
                        c.classList.add('related');
                    }
                    if (selectedVal !== 0 && val === selectedVal) {
                        c.classList.add('match');
                    }
                }
            });
        }

        function toggleNoteMode() {
            isNotesMode = !isNotesMode;
            document.getElementById('note-toggle').classList.toggle('active', isNotesMode);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('sudoku_theme', next);
        }

        function maybeResumeLastGame() {
            const lastIdRaw = localStorage.getItem('sudoku_last_level');
            if (!lastIdRaw) return;
            const lastId = parseInt(lastIdRaw, 10);
            if (!Number.isFinite(lastId)) return;
            const saved = loadGameStatus(lastId);
            if (!saved) return;
            initGame(lastId);
        }

        function erase() {
            if (selectedIdx !== null && !cellsData[selectedIdx].fixed) {
                const oldVal = cellsData[selectedIdx].value;
                const oldNotes = cellsData[selectedIdx].notes.slice();
                cellsData[selectedIdx].value = 0;
                cellsData[selectedIdx].notes = [];
                updateCellDisplay(gridEl.children[selectedIdx], cellsData[selectedIdx]);
                if (oldVal !== 0 || oldNotes.length) {
                    recordAction('erase', `${cellLabel(selectedIdx)} 清除`, selectedIdx, 0);
                }
                saveGameStatus();
                updateNumpadState();
            }
        }

        function updateNumpadState() {
            if (!numButtons.length || !cellsData.length) return;
            const counts = new Array(10).fill(0);
            for (const c of cellsData) {
                if (c.value >= 1 && c.value <= 9) counts[c.value] += 1;
            }
            numButtons.forEach((btn, i) => {
                const n = i + 1;
                btn.classList.toggle('completed', counts[n] >= 9);
            });
        }

        const np = document.getElementById('numpad');
        for (let i = 1; i <= 9; i++) {
            const b = document.createElement('button');
            b.className = 'num-btn';
            b.textContent = i;
            // 使用 mousedown / touchstart 讓觸發更及時，同時防止右鍵選單
            b.addEventListener('pointerdown', (ev) => {
                if (ev && ev.button !== undefined && ev.button !== 0) return;
                handleInput(i);
            });
            b.addEventListener('contextmenu', (e) => e.preventDefault());
            numButtons.push(b);
            np.appendChild(b);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key >= 1 && e.key <= 9) handleInput(parseInt(e.key));
            if (e.key === 'Backspace') erase();
        });

        // Init Theme
        const savedTheme = localStorage.getItem('sudoku_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const APP_VERSION = '2026.03.10-V2';
        document.getElementById('version-badge').textContent = `v${APP_VERSION}`;

        function enforceAppVersion() {
            const key = 'sudoku_app_version';
            const stored = localStorage.getItem(key);
            if (stored === APP_VERSION) return Promise.resolve(false);

            localStorage.setItem(key, APP_VERSION);
            if ('serviceWorker' in navigator) {
                return navigator.serviceWorker.getRegistrations()
                    .then((regs) => Promise.all(regs.map((r) => r.unregister())))
                    .then(() => {
                        if ('caches' in window) {
                            return caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))));
                        }
                    })
                    .then(() => {
                        window.location.reload();
                        return true;
                    })
                    .catch(() => {
                        window.location.reload();
                        return true;
                    });
            } else {
                window.location.reload();
                return Promise.resolve(true);
            }
        }

        // Initialize Service Worker and Handle Updates
        if ('serviceWorker' in navigator) {
            // 監聽 controllerchange，當新的 SW 接管時執行重新載入
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });

            navigator.serviceWorker.register('sw.js').then(reg => {
                // 如果頁面載入時已經有等待中的 SW
                if (reg.waiting) {
                    offerUpdate(reg.waiting);
                }

                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            offerUpdate(installingWorker);
                        }
                    };
                };

                // 每小時自動檢查一次更新
                setInterval(() => reg.update(), 1000 * 60 * 60);

            }).catch(err => console.error('SW init fail:', err));

            function offerUpdate(worker) {
                // 使用延遲確保 UI 穩定後再提示
                setTimeout(() => {
                    if (confirm('發現新的版本與關卡！是否立即更新以體驗最新內容？')) {
                        worker.postMessage({ type: 'SKIP_WAITING' });
                    }
                }, 1000);
            }
        }

        // 執行版本檢查
        enforceAppVersion();
        initFirebase();
        loadAliasToInput();
        if (aliasInputEl) {
            aliasInputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveAlias();
            });
        }
        if (replayModalEl) {
            replayModalEl.addEventListener('click', (e) => {
                if (e.target === replayModalEl) closeReplayModal();
            });
        }
        window.addEventListener('beforeunload', () => {
            if (document.querySelector('.game-container').style.display === 'flex') {
                saveGameStatus();
            }
        });
        window.addEventListener('resize', () => {
            if (document.getElementById('level-screen').style.display === 'flex') {
                requestAnimationFrame(syncLevelCardSize);
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && document.querySelector('.game-container').style.display === 'flex') {
                saveGameStatus();
            }
        });
        showLevelScreen();
        maybeResumeLastGame();
    </script>
</body>

</html>
