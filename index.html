<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
    <title>Minimal Sudoku Pro - Elegant Zen Puzzle</title>
    <meta name="description"
        content="A clean, minimalist Sudoku game featuring a premium life system, dark mode, and zen design. Play Sudoku online with a professional interface.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sudoku Zen">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
    <style>
        :root[data-theme="light"] {
            --bg-color: #F8F9FA;
            --grid-bg: #FFFFFF;
            --cell-border: #D1D5DB;
            /* 加深格線顏色專注對比 */
            --block-border: #9CA3AF;
            /* 加深區域線顏色 */
            --text-main: #2D3436;
            --text-light: #636E72;
            --accent-soft: rgba(9, 132, 227, 0.08);
            /* 改為半透明確保格線透出 */
            --accent-strong: #0984E3;
            --note-color: #A29BFE;
            --error-color: #D63031;
            --btn-bg: #FFFFFF;
            --accent-light: rgba(9, 132, 227, 0.25);
        }

        :root[data-theme="dark"] {
            --bg-color: #181A1D;
            --grid-bg: #22252A;
            --cell-border: #3A424D;
            --block-border: #566070;
            --text-main: #D8DCE2;
            --text-light: #9AA0A6;
            --accent-soft: rgba(90, 169, 255, 0.16);
            /* 暗色模式高亮透明度調整 */
            --accent-strong: #5AA9FF;
            --note-color: #AFA8FF;
            --error-color: #FF8A80;
            --btn-bg: #2A2D33;
            --accent-light: rgba(90, 169, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            font-family: 'Outfit', 'Inter', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            /* 防止整體滾動 */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        html {
            height: -webkit-fill-available;
        }

        .game-container {
            width: 100%;
            /* 將 max-width 稍微放寬，讓 min() 函數去決定實際大小 */
            max-width: 500px;
            height: 100dvh;
            /* 修改點：增加頂部動態間距 (2vh + 安全區域)，讓 Header 不要貼頂 */
            padding: calc(2vh + env(safe-area-inset-top)) 15px env(safe-area-inset-bottom);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }

        /* 頂部 Header：標題在左，Quit 在右 */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2vh;
            /* 與下方內容保持距離 */
        }

        /* 去掉原本 header 內的舊佈局，讓它變簡單 */
        header h1 {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0;
        }

        /* Quit 按鈕移動到最右上角，風格更輕盈 */
        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .header-btn:active {
            transform: scale(0.9);
        }

        .quit-btn {
            padding: 6px 14px;
            font-size: 0.75rem;
            border: 1px solid var(--cell-border);
            background: var(--btn-bg);
            color: var(--text-light);
            border-radius: 20px;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 0;
        }

        .quit-btn:active {
            transform: scale(0.95);
            background: var(--accent-soft);
        }

        /* 關鍵修正：資訊列與數獨格同寬，並左右對齊 */
        .grid-info-bar {
            /* 與 .sudoku-grid 使用同一固定寬度，避免視窗高度波動造成變形 */
            width: min(100%, 420px);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 8px;
            /* 緊貼在格子上方 */
        }

        .grid-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mini-btn {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            border: 1px solid var(--cell-border);
            background: var(--btn-bg);
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .mini-btn.alt {
            background: transparent;
            border-color: color-mix(in srgb, var(--cell-border) 70%, transparent);
        }

        .mini-btn svg {
            width: 18px;
            height: 18px;
        }

        .mini-btn.active {
            background: var(--accent-strong);
            color: #fff;
            border-color: var(--accent-strong);
            box-shadow: 0 4px 10px rgba(9, 132, 227, 0.25);
        }

        /* 計時器與關卡名 (左上) */
        .grid-info-bar .stats {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 400;
            margin: 0;
        }

        /* 生命值 ✖ ✖ ✖ (右上) */
        .grid-info-bar .life-container {
            font-size: 1rem;
            letter-spacing: 3px;
            /* 稍微縮小間隔，看起來更優雅 */
            line-height: 1;
            color: var(--error-color);
        }

        .life-container span.lost {
            color: var(--cell-border);
        }

        /* 網格與格子 */
        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            background-color: var(--grid-bg);
            border: 2px solid var(--block-border);
            border-radius: 12px;
            overflow: hidden;

            /* 固定棋盤尺寸上限，避免通關動畫或高度變化導致尺寸跳動 */
            width: min(100%, 420px);
            aspect-ratio: 1 / 1;

            margin: 0 auto;
            flex-shrink: 0;
            user-select: none;
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            /* 使用 vw (視窗寬度單位) 讓字體隨螢幕寬度縮放 */
            font-size: min(5.0vw, 22px);
            font-weight: 300;
            border: 0.5px solid var(--cell-border);
            cursor: pointer;
            position: relative;
            background: var(--grid-bg);
            /* 確保文字不換行 */
            white-space: nowrap;
            overflow: hidden;
        }

        .cell:nth-child(3n) {
            border-right: 2px solid var(--block-border);
        }

        .cell:nth-child(9n) {
            border-right: none;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid var(--block-border);
        }

        .cell.related {
            background-color: var(--accent-soft);
        }

        .cell.match {
            background-color: var(--accent-light);
            font-weight: 600;
        }

        .cell.selected {
            background-color: var(--accent-soft);
            outline: 2px inset var(--accent-strong);
            z-index: 1;
        }

        .cell.user-val {
            color: var(--accent-strong);
        }

        .cell.error {
            color: var(--error-color) !important;
            animation: shake 0.4s ease;
        }

        .cell.fixed {
            color: var(--text-main);
            font-weight: 600;
            z-index: 2;
            /* Keep above ghost marker */
        }

        .cell.error-strong {
            background: rgba(214, 48, 49, 0.18) !important;
            outline: 2px solid var(--error-color);
            z-index: 2;
            animation: wrongPulse 0.6s ease;
        }

        .cell.error-peer {
            background: rgba(214, 48, 49, 0.1) !important;
        }

        .cell.wrong-preview {
            color: var(--error-color) !important;
            font-weight: 600;
            opacity: 0.9;
        }

        .cell.unit-complete {
            animation: unitCompletePop 0.55s ease;
            box-shadow: inset 0 0 0 1px rgba(9, 132, 227, 0.35);
        }

        @keyframes unitCompletePop {
            0% {
                transform: scale(1);
                background-color: rgba(9, 132, 227, 0.05);
            }

            35% {
                transform: scale(1.08);
                background-color: rgba(9, 132, 227, 0.22);
            }

            100% {
                transform: scale(1);
                background-color: inherit;
            }
        }

        @keyframes wrongPulse {
            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        @keyframes lifeHit {
            0% {
                transform: translateX(0) scale(1);
            }

            25% {
                transform: translateX(-3px) scale(1.08);
            }

            50% {
                transform: translateX(3px) scale(1.08);
            }

            100% {
                transform: translateX(0) scale(1);
            }
        }

        .life-container.hit {
            animation: lifeHit 0.45s ease;
        }

        #feedback-toast {
            position: fixed;
            left: 50%;
            bottom: calc(20px + env(safe-area-inset-bottom));
            transform: translateX(-50%) translateY(10px);
            background: rgba(52, 73, 94, 0.95);
            color: #fff;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            opacity: 0;
            pointer-events: none;
            z-index: 300;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #feedback-toast.success {
            background: rgba(46, 204, 113, 0.92);
        }

        #feedback-toast.error {
            background: rgba(214, 48, 49, 0.95);
        }

        #feedback-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        /* 遊戲、暫停結束遮罩 */
        #overlay,
        #pause-screen,
        #win-celebration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 12px;
            text-align: center;
        }

        #overlay h2,
        #pause-screen h2,
        #win-celebration h2 {
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        #pause-screen p {
            font-size: 1.2rem;
            color: var(--accent-strong);
            margin-bottom: 30px;
        }

        .leaderboard-card {
            width: min(88%, 320px);
            margin-top: 6px;
            margin-bottom: 10px;
            border: 1px solid var(--cell-border);
            border-radius: 12px;
            padding: 10px 12px;
            background: var(--grid-bg);
            text-align: left;
        }

        .leaderboard-title {
            font-size: 0.78rem;
            color: var(--text-light);
            margin-bottom: 6px;
            letter-spacing: 0.6px;
        }

        .leaderboard-list {
            font-size: 0.78rem;
            line-height: 1.5;
        }

        #pre-level-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .pre-level-panel {
            width: min(92vw, 360px);
            background: var(--grid-bg);
            border: 1px solid var(--cell-border);
            border-radius: 16px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .pre-level-panel h2 {
            font-weight: 300;
            letter-spacing: 4px;
            margin: 0 0 8px 0;
        }

        .pre-level-record {
            font-size: 0.9rem;
            color: var(--text-light);
            margin: 0 0 12px 0;
        }

        .pre-level-record.has-record {
            color: var(--accent-strong);
            font-weight: 500;
        }

        .pre-level-tech {
            font-size: 0.82rem;
            color: var(--text-light);
            margin: 0 0 16px 0;
            padding: 8px 12px;
            background: rgba(9, 132, 227, 0.08);
            border-radius: 8px;
            border: 1px dashed rgba(9, 132, 227, 0.2);
            line-height: 1.4;
        }

        /* Dark mode specific refinements */
        [data-theme="dark"] #pre-level-modal {
            background: rgba(0, 0, 0, 0.65);
        }

        [data-theme="dark"] .pre-level-panel {
            background: rgba(34, 37, 42, 0.9);
            /* var(--grid-bg) with opacity */
            border-color: rgba(90, 169, 255, 0.25);
            /* var(--accent-strong) with low opacity */
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4),
                0 0 15px rgba(90, 169, 255, 0.05);
            /* Subtle glow */
        }

        [data-theme="dark"] .pre-level-record.has-record {
            color: #5AA9FF;
            text-shadow: 0 0 10px rgba(90, 169, 255, 0.3);
        }

        #replay-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 400;
            padding: 20px;
        }

        .replay-panel {
            width: min(92vw, 420px);
            max-height: min(80vh, 680px);
            background: var(--grid-bg);
            border: 1px solid var(--cell-border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .replay-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.8px;
        }

        .replay-summary {
            color: var(--text-light);
            font-size: 0.8rem;
        }

        .replay-list {
            border: 1px solid var(--cell-border);
            border-radius: 10px;
            padding: 8px 10px;
            overflow: auto;
            height: min(55vh, 420px);
            font-size: 0.82rem;
            line-height: 1.5;
            background: var(--btn-bg);
        }

        .replay-item {
            border-bottom: 1px dashed var(--cell-border);
            padding: 5px 0;
        }

        .replay-item:last-child {
            border-bottom: none;
        }

        .replay-time {
            color: var(--accent-strong);
            margin-right: 6px;
            font-weight: 600;
        }

        .replay-filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .replay-filter-btn {
            border: 1px solid var(--cell-border);
            background: var(--btn-bg);
            color: var(--text-light);
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 0.74rem;
            cursor: pointer;
        }

        .replay-filter-btn.active {
            color: #fff;
            background: var(--accent-strong);
            border-color: var(--accent-strong);
        }

        /* ===== Visual Replay Board ===== */
        .replay-visual-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid var(--cell-border);
        }

        .replay-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: min(60vw, 240px);
            height: min(60vw, 240px);
            border: 2px solid var(--accent-strong);
            border-radius: 6px;
            overflow: hidden;
            user-select: none;
        }

        .rb-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.5rem, 1.7vw, 0.7rem);
            font-weight: 500;
            border-right: 1px solid var(--cell-border);
            border-bottom: 1px solid var(--cell-border);
            color: var(--num-color);
            background: var(--grid-bg);
            transition: background 0.15s;
        }

        .rb-cell.rb-fixed {
            color: var(--text-light);
            font-weight: 700;
        }

        .rb-cell.rb-fill {
            color: var(--accent-strong);
        }

        .rb-cell.rb-err {
            color: var(--error-color);
            background: rgba(214, 48, 49, 0.12);
        }

        .rb-cell.rb-active {
            background: rgba(9, 132, 227, 0.18);
        }

        .rb-cell.rb-box-border-right {
            border-right-width: 2px;
            border-right-color: var(--accent-strong);
        }

        .rb-cell.rb-box-border-bottom {
            border-bottom-width: 2px;
            border-bottom-color: var(--accent-strong);
        }

        .replay-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .replay-ctrl-btn {
            border: 1px solid var(--cell-border);
            background: var(--btn-bg);
            color: var(--text-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .replay-ctrl-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .replay-ctrl-btn.active {
            background: var(--accent-strong);
            color: #fff;
            border-color: var(--accent-strong);
        }

        .replay-step-info {
            font-size: 0.78rem;
            color: var(--text-light);
            min-width: 70px;
            text-align: center;
        }

        #win-celebration {
            z-index: 30;
            background: radial-gradient(circle at top, rgba(9, 132, 227, 0.16), var(--bg-color) 60%);
            overflow: hidden;
        }

        #win-celebration p {
            margin: 8px 0;
            color: var(--text-light);
        }

        #win-celebration .win-time {
            font-size: 1.2rem;
            color: var(--accent-strong);
            font-weight: 600;
        }

        #win-celebration .win-stars {
            font-size: 1.4rem;
            letter-spacing: 4px;
            color: #F1C40F;
            margin-bottom: 16px;
        }

        .confetti-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 12px;
            opacity: 0.85;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.95;
            }

            100% {
                transform: translateY(110vh) rotate(680deg);
                opacity: 0.1;
            }
        }

        .retry-btn,
        .back-btn,
        .resume-btn {
            margin-top: 15px;
            padding: 10px 30px;
            border: 1px solid var(--text-main);
            background: none;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 20px;
            width: 180px;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
        }

        .resume-btn {
            background: var(--accent-strong);
            color: white;
            border: none;
            box-shadow: 0 4px 12px rgba(9, 132, 227, 0.3);
        }

        /* Level Selector Redesign */
        #level-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
            transition: opacity 0.4s;
        }

        .tabs-container {
            display: flex;
            gap: 6px;
            margin-bottom: 30px;
            background: var(--grid-bg);
            padding: 5px;
            border-radius: 25px;
            border: 1px solid var(--cell-border);
            width: 100%;
            max-width: 400px;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            min-width: 65px;
            padding: 10px 5px;
            border: none;
            background: none;
            color: var(--text-light);
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 20px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--accent-strong);
            color: white;
            box-shadow: 0 4px 12px rgba(9, 132, 227, 0.3);
        }

        .random-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 6px 0 14px;
            flex-wrap: wrap;
        }

        .random-btn {
            border: 1px solid color-mix(in srgb, var(--cell-border) 78%, transparent);
            background: color-mix(in srgb, var(--btn-bg) 96%, #ffffff 4%);
            color: var(--text-main);
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .random-btn.ghost {
            background: transparent;
        }

        .random-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .alias-config {
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: -10px;
            margin-bottom: 16px;
        }

        .alias-input {
            flex: 1;
            border: 1px solid var(--cell-border);
            border-radius: 10px;
            background: var(--grid-bg);
            color: var(--text-main);
            padding: 8px 10px;
            font-size: 0.82rem;
            outline: none;
        }

        .alias-input:focus {
            border-color: var(--accent-strong);
            box-shadow: 0 0 0 2px var(--accent-soft);
        }

        .alias-save-btn {
            border: 1px solid var(--cell-border);
            border-radius: 10px;
            background: var(--btn-bg);
            color: var(--text-main);
            padding: 8px 12px;
            font-size: 0.78rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .version-badge {
            position: fixed;
            right: 10px;
            bottom: 10px;
            font-size: 0.68rem;
            letter-spacing: 0.6px;
            color: var(--text-light);
            background: color-mix(in srgb, var(--btn-bg) 70%, transparent);
            border: 1px solid color-mix(in srgb, var(--cell-border) 70%, transparent);
            border-radius: 999px;
            padding: 4px 8px;
            z-index: 50;
            pointer-events: none;
        }

        #level-list {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 400px;
            height: 100%;
            overflow-y: auto;
            padding-bottom: 40px;
            scroll-behavior: smooth;
        }

        .level-item {
            background: var(--grid-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            border: 1px solid var(--cell-border);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s, border-color 0.2s;
            overflow: hidden;
            min-height: 0;
        }

        .level-item:active {
            transform: scale(0.92);
        }

        .level-item.completed {
            border-color: var(--accent-strong);
            background: var(--accent-soft);
        }

        .level-num {
            font-size: 0.72rem;
            font-weight: 500;
            text-align: center;
            line-height: 1.15;
            min-height: 2.2em;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0 3px;
        }

        .level-stats {
            font-size: 0.7rem;
            color: var(--text-light);
            min-height: 1em;
        }

        .level-stars {
            font-size: 0.75rem;
            color: #F1C40F;
            /* 金色星星 */
            margin-top: 2px;
            min-height: 1em;
        }

        .level-stars .empty-star {
            color: var(--cell-border);
        }

        .level-stars.is-empty,
        .level-stats.is-empty {
            visibility: hidden;
        }

        /* Scrollbar styling */
        #level-list::-webkit-scrollbar {
            width: 4px;
        }

        #level-list::-webkit-scrollbar-thumb {
            background: var(--block-border);
            border-radius: 10px;
        }

        /* 控制區 */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: min(84vw, 300px);
            margin-top: auto;
            margin-bottom: 0;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .num-btn {
            aspect-ratio: 1/1;
            border: 1px solid color-mix(in srgb, var(--cell-border) 82%, transparent);
            background: linear-gradient(180deg, color-mix(in srgb, var(--btn-bg) 98%, #ffffff 2%), color-mix(in srgb, var(--btn-bg) 92%, var(--bg-color)));
            font-size: min(6.2vw, 1.35rem);
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            border-radius: 16px;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            transition: transform 0.15s ease, opacity 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .num-btn::after {
            content: "";
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 6px;
            height: 4px;
            background: var(--accent-strong);
            transform: scaleX(0);
            transform-origin: left;
            opacity: 0.95;
            border-radius: 999px;
        }

        .num-btn.long-pressing::after {
            animation: holdFill 320ms linear forwards;
        }

        .num-btn:active {
            transform: translateY(1px) scale(0.97);
            box-shadow: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .num-btn:hover {
                transform: translateY(-1px);
                border-color: color-mix(in srgb, var(--accent-strong) 45%, var(--cell-border));
                box-shadow: none;
            }
        }

        .num-btn.completed {
            opacity: 0.42;
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--cell-border) 60%, transparent);
            border-color: color-mix(in srgb, var(--cell-border) 75%, transparent);
        }

        .num-btn.completed::after {
            display: none;
        }

        @media (max-height: 780px) {
            .numpad {
                gap: 5px;
                width: min(82vw, 280px);
            }

            .num-btn {
                font-size: min(5.2vw, 1.1rem);
                border-radius: 14px;
            }
        }

        @media (max-height: 850px) {
            .numpad {
                width: min(83vw, 290px);
                gap: 6px;
            }

            .num-btn {
                font-size: min(5.4vw, 1.15rem);
            }
        }

        @keyframes holdFill {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin-top: 0;
            padding-bottom: 0;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ctrl-btn.active {
            color: var(--accent-strong);
        }

        .ctrl-btn svg {
            width: 22px;
            height: 22px;
            margin-bottom: 6px;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100%;
            height: 100%;
            padding: 0;
            pointer-events: none;
        }

        .note-num {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.55rem;
            line-height: 1;
            color: var(--note-color);
            opacity: 0;
        }

        .note-num.active {
            opacity: 1;
        }

        /* ===== Stats & Achievements Modal ===== */
        #stats-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        [data-theme="dark"] #stats-modal {
            background: rgba(0, 0, 0, 0.65);
        }

        .stats-panel {
            width: min(92vw, 400px);
            max-height: min(85vh, 720px);
            background: var(--grid-bg);
            border: 1px solid var(--cell-border);
            border-radius: 16px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] .stats-panel {
            background: rgba(34, 37, 42, 0.95);
            border-color: rgba(90, 169, 255, 0.25);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.4), 0 0 15px rgba(90, 169, 255, 0.05);
        }

        .stats-panel::-webkit-scrollbar {
            width: 4px;
        }

        .stats-panel::-webkit-scrollbar-thumb {
            background: var(--block-border);
            border-radius: 10px;
        }

        .stats-panel h2 {
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0;
            text-align: center;
            font-size: 1.1rem;
        }

        .stats-tabs {
            display: flex;
            gap: 0;
            background: var(--bg-color);
            border-radius: 10px;
            padding: 3px;
            border: 1px solid var(--cell-border);
        }

        .stats-tab-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: none;
            color: var(--text-light);
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        .stats-tab-btn.active {
            background: var(--accent-strong);
            color: #fff;
            box-shadow: 0 2px 8px rgba(9, 132, 227, 0.3);
        }

        .stats-section {
            border: 1px solid var(--cell-border);
            border-radius: 12px;
            padding: 12px;
            background: var(--btn-bg);
        }

        .stats-section-title {
            font-size: 0.78rem;
            color: var(--text-light);
            margin-bottom: 8px;
            letter-spacing: 0.6px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .stat-item {
            text-align: center;
            padding: 8px 4px;
            border-radius: 8px;
            background: var(--bg-color);
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent-strong);
        }

        .stat-label {
            font-size: 0.68rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        .tier-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 0.78rem;
        }

        .tier-name {
            min-width: 42px;
            color: var(--text-light);
            font-size: 0.72rem;
        }

        .tier-bar {
            flex: 1;
            height: 8px;
            background: var(--bg-color);
            border-radius: 4px;
            overflow: hidden;
        }

        .tier-bar-fill {
            height: 100%;
            background: var(--accent-strong);
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .tier-count {
            min-width: 42px;
            text-align: right;
            color: var(--text-light);
            font-size: 0.7rem;
        }

        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .achievement-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 4px 8px;
            border-radius: 10px;
            background: var(--bg-color);
            border: 1px solid var(--cell-border);
            text-align: center;
            transition: all 0.3s;
        }

        .achievement-card.locked {
            opacity: 0.3;
            filter: grayscale(1);
        }

        .achievement-card.unlocked {
            border-color: var(--accent-strong);
            background: var(--accent-soft);
        }

        .achievement-icon {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .achievement-name {
            font-size: 0.68rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .achievement-desc {
            font-size: 0.58rem;
            color: var(--text-light);
            line-height: 1.2;
            margin-top: 2px;
        }

        .achievement-date {
            font-size: 0.55rem;
            color: var(--accent-strong);
            margin-top: 3px;
        }

        .achievement-counter {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-light);
            margin-top: 4px;
        }

        .achievement-counter span {
            color: var(--accent-strong);
            font-weight: 600;
        }

        /* Achievement unlock toast */
        .achievement-toast {
            position: fixed;
            top: calc(20px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: var(--grid-bg);
            border: 1px solid var(--accent-strong);
            border-radius: 14px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 500;
            box-shadow: 0 8px 24px rgba(9, 132, 227, 0.25);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
            pointer-events: none;
        }

        .achievement-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .achievement-toast-icon {
            font-size: 1.8rem;
        }

        .achievement-toast-text {
            display: flex;
            flex-direction: column;
        }

        .achievement-toast-label {
            font-size: 0.65rem;
            color: var(--text-light);
            letter-spacing: 1px;
        }

        .achievement-toast-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-strong);
        }

        /* ===== Duo Room System ===== */
        @keyframes duoPulse {
            0%, 100% { box-shadow: 0 0 6px rgba(232, 67, 147, 0.25); border-color: rgba(232, 67, 147, 0.4); }
            50% { box-shadow: 0 0 18px rgba(232, 67, 147, 0.5); border-color: rgba(232, 67, 147, 0.7); }
        }
        .level-item.duo-glow {
            animation: duoPulse 1.8s ease-in-out infinite;
            position: relative;
        }
        .level-item.duo-glow::after {
            content: '💕';
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 0.65rem;
            line-height: 1;
        }

        .duo-ready-zone {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(232, 67, 147, 0.25);
            border-radius: 12px;
            background: rgba(232, 67, 147, 0.04);
            margin-bottom: 10px;
            text-align: center;
        }
        [data-theme="dark"] .duo-ready-zone {
            background: rgba(232, 67, 147, 0.08);
            border-color: rgba(232, 67, 147, 0.3);
        }
        .duo-zone-title {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .duo-player-slots {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 12px;
        }
        .duo-player-slot {
            flex: 1;
            max-width: 140px;
            padding: 10px 8px;
            border-radius: 10px;
            border: 1.5px solid var(--cell-border);
            background: var(--grid-bg);
            transition: all 0.3s;
        }
        .duo-player-slot.ready {
            border-color: #00b894;
            background: rgba(0, 184, 148, 0.08);
        }
        .duo-player-slot.empty {
            opacity: 0.4;
            border-style: dashed;
        }
        .duo-slot-alias {
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .duo-slot-status {
            font-size: 0.68rem;
            color: var(--text-light);
        }
        .duo-slot-status.is-ready {
            color: #00b894;
            font-weight: 600;
        }
        .duo-countdown-display {
            font-size: 3rem;
            font-weight: 300;
            color: var(--accent-strong);
            letter-spacing: 4px;
            margin: 10px 0;
            opacity: 0;
            transform: scale(1.5);
            animation: countdownPop 0.8s ease forwards;
        }
        @keyframes countdownPop {
            0% { opacity: 0; transform: scale(1.8); }
            40% { opacity: 1; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .duo-ready-btn {
            margin-top: 8px;
            padding: 10px 30px;
            background: rgba(232, 67, 147, 0.1);
            border: 1px solid rgba(232, 67, 147, 0.5);
            color: #e84393;
            cursor: pointer;
            border-radius: 20px;
            width: 180px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .duo-ready-btn.is-ready {
            background: #00b894;
            border-color: #00b894;
            color: #fff;
        }
        .duo-ready-btn:active { transform: scale(0.95); }

        /* Duo progress during gameplay */
        .duo-progress-container {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-left: auto;
            margin-right: 10px;
        }
        .duo-progress-bar-wrap {
            width: 60px;
            height: 6px;
            background: var(--bg-color);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--cell-border);
        }
        .duo-progress-fill {
            height: 100%;
            background: #e84393;
            border-radius: 3px;
            transition: width 0.4s ease;
            width: 0%;
        }

        /* Duo result overlay */
        #duo-result-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 250;
            padding: 20px;
        }
        .duo-result-panel {
            width: min(92vw, 360px);
            background: var(--grid-bg);
            border: 1px solid var(--cell-border);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        [data-theme="dark"] .duo-result-panel {
            background: rgba(34, 37, 42, 0.95);
            border-color: rgba(232, 67, 147, 0.25);
        }
        .duo-result-panel h2 {
            font-weight: 300;
            letter-spacing: 3px;
            margin: 0 0 16px;
            font-size: 1.05rem;
        }
        .duo-result-cards {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 18px;
        }
        .duo-result-card {
            flex: 1;
            max-width: 150px;
            padding: 14px 8px;
            border-radius: 12px;
            border: 1.5px solid var(--cell-border);
            background: var(--btn-bg);
        }
        .duo-result-card.winner {
            border-color: #e84393;
            background: rgba(232, 67, 147, 0.06);
        }
        .duo-result-crown {
            font-size: 1.2rem;
            margin-bottom: 4px;
        }
        .duo-result-alias {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .duo-result-time {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-strong);
        }
        .duo-result-stars {
            font-size: 0.85rem;
            color: #F1C40F;
            margin-top: 2px;
        }
        .duo-result-diff {
            font-size: 0.78rem;
            color: var(--text-light);
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .duo-result-record {
            font-size: 0.72rem;
            color: var(--text-light);
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--cell-border);
        }
        .duo-result-record span {
            font-weight: 600;
            color: var(--accent-strong);
        }
        .duo-streak-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(232, 67, 147, 0.1);
            border: 1px solid rgba(232, 67, 147, 0.3);
            color: #e84393;
            margin-bottom: 8px;
        }

        /* Emoji Reaction System */
        .duo-emoji-bar {
            display: none;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
            padding-bottom: 2px;
        }
        .duo-emoji-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--cell-border);
            background: var(--btn-bg);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: transform 0.15s;
        }
        .duo-emoji-btn:active {
            transform: scale(0.85);
        }
        @keyframes emojiFloat {
            0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            60% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(1.4); }
        }
        .duo-emoji-float {
            position: fixed;
            font-size: 2.2rem;
            pointer-events: none;
            z-index: 600;
            animation: emojiFloat 1.4s ease-out forwards;
        }
    </style>
</head>

<body>

    <div id="level-screen">
        <div
            style="width: 100%; display: flex; justify-content: space-between; align-items: center; max-width: 400px; margin-bottom: 25px;">
            <h1 style="margin: 0; font-weight: 300; letter-spacing: 5px; font-family: 'Outfit';">SUDOKU ZEN</h1>
            <div style="display: flex; align-items: center; gap: 2px;">
                <button id="stats-btn" onclick="openStatsModal()" title="個人統計與成就"
                    aria-label="個人統計"
                    style="font-size: 1.2rem; opacity: 0.45; background: none; border: none; cursor: pointer; padding: 5px; transition: all 0.3s;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                </button>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script>
        const gridEl = document.getElementById('grid');
        const livesEl = document.getElementById('lives');
        const overlay = document.getElementById('overlay');
        const timerEl = document.getElementById('timer');
        const winCelebrationEl = document.getElementById('win-celebration');
        const confettiLayerEl = document.getElementById('confetti-layer');
        const leaderboardListEl = document.getElementById('leaderboard-list');
        const winLeaderboardListEl = document.getElementById('win-leaderboard-list');
        const aliasInputEl = document.getElementById('alias-input');
        const replayModalEl = document.getElementById('replay-modal');
        const replaySummaryEl = document.getElementById('replay-summary');
        const replayListEl = document.getElementById('replay-list');
        const replayFilterAllBtn = document.getElementById('replay-filter-all');
        const replayFilterMistakeBtn = document.getElementById('replay-filter-mistake');
        const replayFilterKeyBtn = document.getElementById('replay-filter-key');
        const midPoolLevels = (typeof midPool !== 'undefined' && Array.isArray(midPool))
            ? midPool.map(l => ({ ...l, hidden: true }))
            : [];
        if (midPoolLevels.length) {
            const existingIds = new Set(levels.map(l => l.id));
            midPoolLevels.forEach(l => {
                if (!existingIds.has(l.id)) levels.push(l);
            });
        }
        let feedbackTimer = null;
        let db = null;
        let firebaseReady = false;
        const ALIAS_MIN_LEN = 1;
        const ALIAS_MAX_LEN = 24;

        const feedbackToast = document.createElement('div');
        feedbackToast.id = 'feedback-toast';
        document.body.appendChild(feedbackToast);

        let selectedIdx = null;
        let isNotesMode = false;
        let isSpeedrunMode = localStorage.getItem('sudoku_speedrun') === 'true';
        let submissionCount = 0;
        let errors = 0;
        const maxErrors = 3;
        let seconds = 0;
        let timerInterval = null;
        let currentLevel = null;

        let cellsData = [];
        let actionHistory = [];
        let replayFilter = 'all';
        let numButtons = [];

        function normalizeAlias(raw) {
            if (typeof raw !== 'string') return '';
            return raw.trim().slice(0, ALIAS_MAX_LEN);
        }

        function loadAliasToInput() {
            if (!aliasInputEl) return;
            const saved = localStorage.getItem('sudoku_player_alias') || '';
            aliasInputEl.value = saved;
        }

        function saveAlias() {
            const alias = normalizeAlias(aliasInputEl ? aliasInputEl.value : '');
            if (alias.length < ALIAS_MIN_LEN) {
                showFeedback('暱稱至少 1 個字');
                return;
            }
            localStorage.setItem('sudoku_player_alias', alias);
            if (aliasInputEl) aliasInputEl.value = alias;
            showFeedback(`暱稱已更新：${alias}`);
        }

        function getPlayerIdentity() {
            let playerId = localStorage.getItem('sudoku_player_id');
            if (!playerId) {
                playerId = `p_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
                localStorage.setItem('sudoku_player_id', playerId);
            }
            let alias = localStorage.getItem('sudoku_player_alias');
            if (!alias) {
                alias = `玩家${Math.floor(Math.random() * 9000) + 1000}`;
                localStorage.setItem('sudoku_player_alias', alias);
            }
            alias = normalizeAlias(alias);
            if (alias.length < ALIAS_MIN_LEN) alias = `玩家${Math.floor(Math.random() * 9000) + 1000}`;
            localStorage.setItem('sudoku_player_alias', alias);
            return { playerId, alias };
        }

        function initFirebase() {
            try {
                if (!window.firebase || !window.SUDOKU_FIREBASE_CONFIG) return;
                if (!firebase.apps.length) firebase.initializeApp(window.SUDOKU_FIREBASE_CONFIG);
                db = firebase.firestore();
                firebaseReady = true;
            } catch (e) {
                console.warn('Firebase init failed:', e);
            }
        }

        function formatSeconds(sec) {
            const mins = Math.floor(sec / 60).toString().padStart(2, '0');
            const secs = (sec % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function cellLabel(idx) {
            const r = Math.floor(idx / 9) + 1;
            const c = (idx % 9) + 1;
            return `R${r}C${c}`;
        }

        function recordAction(type, detail, idx = null, val = null, notes = null) {
            actionHistory.push({
                t: seconds,
                type,
                detail,
                idx,
                val,
                notes: notes ? notes.slice() : null
            });
            if (actionHistory.length > 1200) actionHistory.shift();
        }

        function isKeyReplayAction(a) {
            return ['fill', 'mistake', 'quick_note'].includes(a.type);
        }

        function getFilteredReplayActions() {
            if (replayFilter === 'mistake') return actionHistory.filter(a => a.type === 'mistake');
            if (replayFilter === 'key') return actionHistory.filter(isKeyReplayAction);
            return actionHistory;
        }

        function syncReplayFilterButtons() {
            if (!replayFilterAllBtn) return;
            replayFilterAllBtn.classList.toggle('active', replayFilter === 'all');
            replayFilterMistakeBtn.classList.toggle('active', replayFilter === 'mistake');
            replayFilterKeyBtn.classList.toggle('active', replayFilter === 'key');
        }

        function setReplayFilter(filterKey) {
            replayFilter = filterKey;
            syncReplayFilterButtons();
            renderReplayList();
        }

        function renderReplayList() {
            const filtered = getFilteredReplayActions();
            const filterLabel =
                replayFilter === 'mistake' ? '錯誤步驟' :
                    replayFilter === 'key' ? '關鍵步驟' : '全部步驟';
            replaySummaryEl.textContent =
                `${currentLevel.displayName} / 用時 ${formatSeconds(seconds)} / ${filterLabel} ${filtered.length}/${actionHistory.length}`;

            if (!filtered.length) {
                replayListEl.innerHTML = '<div class="replay-item">此篩選下暫無步驟</div>';
                return;
            }
            replayListEl.innerHTML = filtered.map((a, i) => (
                `<div class="replay-item"><span class="replay-time">${formatSeconds(a.t)}</span>#${i + 1} ${a.detail}</div>`
            )).join('');
        }

        function openReplayModal() {
            if (!replayModalEl) return;
            replayFilter = 'all';
            syncReplayFilterButtons();
            renderReplayList();
            replayOpen();
            replayModalEl.style.display = 'flex';
        }

        function openHistoricalReplay(levelId, savedHistory) {
            currentLevel = levels.find(l => l.id === levelId) || levels[0];
            actionHistory = savedHistory;
            // Clean slate for cellsData so the UI can rebuild it cleanly
            cellsData = currentLevel.puzzle.map((val, idx) => ({
                value: val,
                fixed: val !== 0,
                notes: [],
                isError: false
            }));

            document.getElementById('pre-level-modal').style.display = 'none';
            openReplayModal();
        }

        function closeReplayModal() {
            if (!replayModalEl) return;
            replayPause();
            replayModalEl.style.display = 'none';
        }

        // ===== Visual Replay Engine =====
        let rbState = [];          // Current board state (array of 81 entries: {value, fixed, notes})
        let rbStepIdx = 0;         // Current step (0 = initial puzzle)
        let rbIsPlaying = false;
        let rbTimer = null;
        let rbSpeed = 1;           // 1, 2, or 4
        const RB_BASE_INTERVAL = 700; // ms per step at 1x speed

        function replayOpen() {
            // Build initial state from current level puzzle
            rbState = currentLevel.puzzle.map(v => ({ value: v, fixed: v !== 0, notes: [] }));
            rbStepIdx = 0;
            rbIsPlaying = false;
            rbSpeed = 1;
            document.getElementById('rb-speed-btn').textContent = '1x';
            replayRenderBoard(-1);
            replayUpdateStepInfo();
            replayUpdateButtons();
        }

        function replayBuildStateAtStep(targetStep) {
            // Rebuild from scratch up to targetStep
            const state = currentLevel.puzzle.map(v => ({ value: v, fixed: v !== 0, notes: [] }));
            for (let i = 0; i < targetStep && i < actionHistory.length; i++) {
                replayApplyActionToState(state, actionHistory[i]);
            }
            return state;
        }

        function replayApplyActionToState(state, action) {
            const { type, idx, val, notes } = action;
            if (idx === null || idx === undefined) return;
            if (type === 'fill') {
                state[idx].value = val;
                state[idx].notes = [];
            } else if (type === 'erase') {
                state[idx].value = 0;
                state[idx].notes = [];
            } else if (type === 'note' && notes !== null) {
                state[idx].notes = notes.slice();
            }
            // 'mistake' → show value temporarily but don't permanently fill
        }

        function replayRenderBoard(highlightIdx) {
            const boardEl = document.getElementById('replay-board');
            if (!boardEl) return;
            boardEl.innerHTML = '';
            rbState.forEach((cell, i) => {
                const div = document.createElement('div');
                div.className = 'rb-cell';
                const row = Math.floor(i / 9), col = i % 9;
                const box = Math.floor(row / 3) * 3 + Math.floor(col / 3);
                if (col === 2 || col === 5) div.classList.add('rb-box-border-right');
                if (row === 2 || row === 5) div.classList.add('rb-box-border-bottom');
                if (cell.fixed) {
                    div.classList.add('rb-fixed');
                    div.textContent = cell.value;
                } else if (cell.value !== 0) {
                    div.classList.add('rb-fill');
                    div.textContent = cell.value;
                } else if (cell.notes.length) {
                    div.style.fontSize = 'clamp(0.28rem, 1vw, 0.4rem)';
                    div.style.lineHeight = '1';
                    div.style.flexWrap = 'wrap';
                    div.style.padding = '1px';
                    div.textContent = cell.notes.join(' ');
                }
                if (i === highlightIdx) div.classList.add('rb-active');
                boardEl.appendChild(div);
            });
        }

        function replayUpdateStepInfo() {
            const el = document.getElementById('replay-step-info');
            if (el) el.textContent = `步驟 ${rbStepIdx} / ${actionHistory.length}`;
        }

        function replayUpdateButtons() {
            const prevBtn = document.getElementById('rb-prev-btn');
            const nextBtn = document.getElementById('rb-next-btn');
            const playBtn = document.getElementById('rb-play-btn');
            if (prevBtn) prevBtn.disabled = rbStepIdx <= 0;
            if (nextBtn) nextBtn.disabled = rbStepIdx >= actionHistory.length;
            if (playBtn) {
                playBtn.textContent = rbIsPlaying ? '⏸ 暫停' : '▶ 播放';
                playBtn.classList.toggle('active', rbIsPlaying);
            }
        }

        function replayStepForward() {
            if (rbStepIdx >= actionHistory.length) { replayPause(); return; }
            const action = actionHistory[rbStepIdx];
            const prevState = rbState;
            rbState = replayBuildStateAtStep(rbStepIdx + 1);
            rbStepIdx++;
            const highlightIdx = action.idx !== null && action.idx !== undefined ? action.idx : -1;
            replayRenderBoard(highlightIdx);
            replayUpdateStepInfo();
            replayUpdateButtons();
        }

        function replayStepBack() {
            if (rbStepIdx <= 0) return;
            rbStepIdx--;
            rbState = replayBuildStateAtStep(rbStepIdx);
            const highlightIdx = rbStepIdx > 0 ? (actionHistory[rbStepIdx - 1].idx ?? -1) : -1;
            replayRenderBoard(highlightIdx);
            replayUpdateStepInfo();
            replayUpdateButtons();
        }

        function replayPause() {
            if (rbTimer) { clearInterval(rbTimer); rbTimer = null; }
            rbIsPlaying = false;
            replayUpdateButtons();
        }

        function replayPlay() {
            if (rbStepIdx >= actionHistory.length) replayReset();
            rbIsPlaying = true;
            replayUpdateButtons();
            rbTimer = setInterval(() => {
                if (rbStepIdx >= actionHistory.length) {
                    replayPause();
                } else {
                    replayStepForward();
                }
            }, Math.round(RB_BASE_INTERVAL / rbSpeed));
        }

        function replayTogglePlay() {
            if (rbIsPlaying) replayPause(); else replayPlay();
        }

        function replayReset() {
            replayPause();
            rbStepIdx = 0;
            rbState = currentLevel.puzzle.map(v => ({ value: v, fixed: v !== 0, notes: [] }));
            replayRenderBoard(-1);
            replayUpdateStepInfo();
            replayUpdateButtons();
        }

        function replayToggleSpeed() {
            const speeds = [1, 2, 4];
            rbSpeed = speeds[(speeds.indexOf(rbSpeed) + 1) % speeds.length];
            const speedBtn = document.getElementById('rb-speed-btn');
            if (speedBtn) speedBtn.textContent = `${rbSpeed}x`;
            // Restart timer at new speed if playing
            if (rbIsPlaying) { replayPause(); replayPlay(); }
        }

        let isGhostMode = false;
        let ghostHistory = [];
        let ghostIdx = 0;
        let playerFilledCount = 0;
        let ghostFilledCount = 0;

        function updateGhostEngine(currentSecs) {
            if (!isGhostMode || ghostIdx >= ghostHistory.length) return;

            let changed = false;
            while (ghostIdx < ghostHistory.length && ghostHistory[ghostIdx].t <= currentSecs) {
                const action = ghostHistory[ghostIdx];
                if (action.type === 'fill') {
                    const cEl = gridEl.children[action.idx];
                    if (!cEl.classList.contains('ghost-marked')) {
                        cEl.classList.add('ghost-marked');
                        ghostFilledCount++;
                        changed = true;
                    }
                } else if (action.type === 'erase') {
                    const cEl = gridEl.children[action.idx];
                    if (cEl.classList.contains('ghost-marked')) {
                        cEl.classList.remove('ghost-marked');
                        ghostFilledCount--;
                        changed = true;
                    }
                }
                ghostIdx++;
            }
            if (changed) updateGhostProgressUI();
        }

        function updateGhostProgressUI() {
            if (!isGhostMode) return;
            document.getElementById('ghost-progress-text').textContent = `👻 ${ghostFilledCount}/81 | 🧑 ${playerFilledCount}/81`;
        }

        // ===== Duo Room System =====
        let isDuoMode = false;
        let duoUnsubscribe = null;
        let duoGlowUnsubscribe = null;
        let duoRole = null; // 'host' | 'guest'
        let duoRoomData = null;
        let duoCountdownTimer = null;
        let duoProgressThrottle = 0;
        let duoMyReady = false;
        let duoTotalToFill = 0;

        function duoRoomRef() {
            return db.collection('duo_room').doc('current');
        }

        async function enterDuoRoom(levelId) {
            if (!firebaseReady) return;
            const { playerId, alias } = getPlayerIdentity();
            try {
                await db.runTransaction(async (tx) => {
                    const doc = await tx.get(duoRoomRef());
                    const d = doc.exists ? doc.data() : null;
                    const now = firebase.firestore.FieldValue.serverTimestamp();

                    // Check staleness (>2 min old waiting rooms can be overwritten)
                    const isStale = d && d.updatedAt && d.updatedAt.toDate &&
                        (Date.now() - d.updatedAt.toDate().getTime() > 120000);

                    if (!d || d.status === 'idle' || d.status === 'finished' || isStale) {
                        // Create new room as host
                        tx.set(duoRoomRef(), {
                            levelId, status: 'waiting',
                            hostId: playerId, hostAlias: alias, hostReady: false,
                            hostProgress: 0, hostFinishTime: null, hostStars: null,
                            guestId: null, guestAlias: null, guestReady: false,
                            guestProgress: 0, guestFinishTime: null, guestStars: null,
                            startAt: null, updatedAt: now
                        });
                        duoRole = 'host';
                    } else if (d.status === 'waiting' && d.hostId !== playerId) {
                        // Join as guest
                        tx.update(duoRoomRef(), {
                            guestId: playerId, guestAlias: alias,
                            guestReady: false, guestProgress: 0,
                            guestFinishTime: null, guestStars: null,
                            updatedAt: now
                        });
                        duoRole = 'guest';
                    } else if (d.status === 'waiting' && d.hostId === playerId) {
                        // Re-opening my own room, update timestamp
                        tx.update(duoRoomRef(), { updatedAt: now, hostAlias: alias });
                        duoRole = 'host';
                    } else {
                        duoRole = null;
                    }
                });
                if (duoRole) subscribeDuoRoom();
            } catch (e) {
                console.warn('enterDuoRoom failed:', e);
                duoRole = null;
            }
        }

        function subscribeDuoRoom() {
            if (duoUnsubscribe) duoUnsubscribe();
            duoUnsubscribe = duoRoomRef().onSnapshot(snap => {
                if (!snap.exists) { resetDuoState(); return; }
                duoRoomData = snap.data();
                handleDuoSnapshot(duoRoomData);
            }, err => {
                console.warn('duo snapshot error:', err);
            });
        }

        function handleDuoSnapshot(d) {
            if (!d || !duoRole) return;
            const { playerId } = getPlayerIdentity();

            if (d.status === 'waiting' || d.status === 'countdown') {
                updateDuoPreLevelUI(d);
            }

            if (d.status === 'countdown' && d.startAt) {
                startDuoCountdown(d.startAt);
            }

            if (d.status === 'playing') {
                // Update opponent progress bar
                const oppProgress = duoRole === 'host' ? d.guestProgress : d.hostProgress;
                const oppAlias = duoRole === 'host' ? (d.guestAlias || '對手') : (d.hostAlias || '對手');
                updateDuoProgressUI(oppAlias, oppProgress || 0);

                // Handle emoji reactions
                handleDuoEmoji(d);

                // Check if opponent finished
                const oppFinish = duoRole === 'host' ? d.guestFinishTime : d.hostFinishTime;
                const oppStars = duoRole === 'host' ? d.guestStars : d.hostStars;
                if (oppFinish !== null && oppFinish !== undefined) {
                    showDuoOpponentFinished(oppAlias, oppFinish, oppStars);
                }

                // Check if both finished
                if (d.hostFinishTime !== null && d.hostFinishTime !== undefined &&
                    d.guestFinishTime !== null && d.guestFinishTime !== undefined) {
                    showDuoResult(d);
                }
            }

            if (d.status === 'finished') {
                showDuoResult(d);
            }
        }

        function updateDuoPreLevelUI(d) {
            const zone = document.getElementById('duo-ready-zone');
            const readyBtn = document.getElementById('duo-ready-btn');
            const countdownArea = document.getElementById('duo-countdown-area');
            if (!zone) return;

            zone.style.display = 'block';

            // Host slot
            document.getElementById('duo-host-alias').textContent = d.hostAlias || '--';
            const hostSlot = document.getElementById('duo-slot-host');
            const hostStatus = document.getElementById('duo-host-status');
            hostSlot.classList.toggle('ready', !!d.hostReady);
            hostStatus.textContent = d.hostReady ? '已準備' : '等待中';
            hostStatus.classList.toggle('is-ready', !!d.hostReady);

            // Guest slot
            const guestSlot = document.getElementById('duo-slot-guest');
            const guestAlias = document.getElementById('duo-guest-alias');
            const guestStatus = document.getElementById('duo-guest-status');
            if (d.guestId) {
                guestSlot.classList.remove('empty');
                guestAlias.textContent = d.guestAlias || '--';
                guestSlot.classList.toggle('ready', !!d.guestReady);
                guestStatus.textContent = d.guestReady ? '已準備' : '等待中';
                guestStatus.classList.toggle('is-ready', !!d.guestReady);
            } else {
                guestSlot.classList.add('empty');
                guestAlias.textContent = '等待加入...';
                guestStatus.textContent = '';
                guestStatus.classList.remove('is-ready');
            }

            // Show streak if present
            const preStreak = document.getElementById('duo-pre-streak');
            if (preStreak && d.guestId) {
                const rec = loadDuoRecords();
                if (rec.streak >= 2 && rec.streakHolder) {
                    preStreak.innerHTML = `<div class="duo-streak-badge">🔥 ${rec.streakHolder} 連勝 ${rec.streak} 場</div>`;
                } else {
                    const wins = rec.wins || {};
                    const names = Object.keys(wins);
                    if (names.length >= 2) {
                        const sorted = names.sort((a, b) => wins[b] - wins[a]);
                        preStreak.innerHTML = `<div style="font-size:0.72rem;color:var(--text-light);margin-bottom:6px;">${sorted[0]} ${wins[sorted[0]]} 勝 — ${sorted[1]} ${wins[sorted[1]]} 勝</div>`;
                    } else {
                        preStreak.innerHTML = '';
                    }
                }
            } else if (preStreak) {
                preStreak.innerHTML = '';
            }

            // Ready button state
            const myReady = duoRole === 'host' ? d.hostReady : d.guestReady;
            if (d.status === 'countdown') {
                readyBtn.style.display = 'none';
                countdownArea.style.display = 'block';
            } else {
                readyBtn.style.display = d.guestId ? 'inline-block' : 'none';
                countdownArea.style.display = 'none';
                readyBtn.textContent = myReady ? '✓ 已準備' : '準備完成';
                readyBtn.classList.toggle('is-ready', myReady);
            }
        }

        async function toggleDuoReady() {
            if (!firebaseReady || !duoRole) return;
            const { playerId } = getPlayerIdentity();
            const field = duoRole === 'host' ? 'hostReady' : 'guestReady';
            duoMyReady = !duoMyReady;

            try {
                await db.runTransaction(async (tx) => {
                    const doc = await tx.get(duoRoomRef());
                    if (!doc.exists) return;
                    const d = doc.data();
                    const update = { [field]: duoMyReady, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };

                    // Check if both will be ready after this update
                    const hostReady = duoRole === 'host' ? duoMyReady : d.hostReady;
                    const guestReady = duoRole === 'guest' ? duoMyReady : d.guestReady;
                    if (hostReady && guestReady && d.guestId) {
                        // Both ready! Set countdown start
                        update.status = 'countdown';
                        // startAt = now + 4 seconds (3s visible countdown + 1s buffer)
                        update.startAt = firebase.firestore.Timestamp.fromMillis(Date.now() + 4000);
                    }
                    tx.update(duoRoomRef(), update);
                });
            } catch (e) {
                console.warn('toggleDuoReady failed:', e);
                duoMyReady = !duoMyReady; // revert
            }
        }

        function startDuoCountdown(startAtTs) {
            if (duoCountdownTimer) return; // already counting
            const area = document.getElementById('duo-countdown-area');
            if (!area) return;

            const targetMs = startAtTs.toMillis ? startAtTs.toMillis() : startAtTs.seconds * 1000;

            duoCountdownTimer = setInterval(() => {
                const remaining = Math.ceil((targetMs - Date.now()) / 1000);
                if (remaining > 0) {
                    area.innerHTML = `<div class="duo-countdown-display" key="${remaining}">${remaining}</div>`;
                } else {
                    clearInterval(duoCountdownTimer);
                    duoCountdownTimer = null;
                    area.innerHTML = `<div class="duo-countdown-display">GO!</div>`;
                    setTimeout(() => launchDuoGame(), 300);
                }
            }, 100);
        }

        function launchDuoGame() {
            if (!duoRoomData) return;
            isDuoMode = true;

            // Calculate total cells to fill
            const level = levels.find(l => l.id === duoRoomData.levelId);
            if (level) {
                duoTotalToFill = level.puzzle.filter(v => v === 0).length;
            }

            // Hide pre-level modal, start game
            hidePreLevelModal();
            document.getElementById('level-screen').style.display = 'none';
            initGame(duoRoomData.levelId, true, false, null);

            // Show duo progress bar and emoji bar
            document.getElementById('duo-progress-container').style.display = 'flex';
            document.getElementById('duo-emoji-bar').style.display = 'flex';

            // Update room status to playing
            if (duoRole === 'host') {
                duoRoomRef().update({
                    status: 'playing',
                    hostProgress: 0, guestProgress: 0,
                    hostFinishTime: null, guestFinishTime: null,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(() => {});
            }
        }

        function updateDuoProgress() {
            if (!isDuoMode || !firebaseReady) return;
            const now = Date.now();
            if (now - duoProgressThrottle < 3000) return; // throttle to every 3s
            duoProgressThrottle = now;
            const filled = cellsData.filter(c => !c.fixed && c.value !== 0).length;
            const field = duoRole === 'host' ? 'hostProgress' : 'guestProgress';
            duoRoomRef().update({
                [field]: filled,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).catch(() => {});

        function updateDuoProgressUI(oppAlias, oppProgress) {
            const el = document.getElementById('duo-progress-text');

        let duoOpponentNotified = false;
        function showDuoOpponentFinished(alias, timeSec, stars) {
            if (duoOpponentNotified) return;

        async function submitDuoFinish(timeSec, stars) {
            if (!isDuoMode || !firebaseReady) return;
            const timeField = duoRole === 'host' ? 'hostFinishTime' : 'guestFinishTime';
            const starsField = duoRole === 'host' ? 'hostStars' : 'guestStars';
            const progressField = duoRole === 'host' ? 'hostProgress' : 'guestProgress';
            try {
                await duoRoomRef().update({
                    [timeField]: timeSec,
                    [starsField]: stars,
                    [progressField]: duoTotalToFill,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
