        function showDuoResult(d) {
            const modal = document.getElementById('duo-result-modal');
            const cardsEl = document.getElementById('duo-result-cards');
            const diffEl = document.getElementById('duo-result-diff');
            const streakEl = document.getElementById('duo-result-streak');
            const recordEl = document.getElementById('duo-result-record');
            if (!modal || !cardsEl || modal.style.display === 'flex') return;

            const hTime = d.hostFinishTime;
            const gTime = d.guestFinishTime;
            if (hTime === null || hTime === undefined || gTime === null || gTime === undefined) return;

            const hWin = hTime < gTime;
            const gWin = gTime < hTime;
            const isDraw = hTime === gTime;
            const diff = Math.abs(hTime - gTime);

            // Record win/draw
            let rec;
            if (isDraw) {
                rec = recordDuoDraw();
            } else {
                const winner = hWin ? d.hostAlias : d.guestAlias;
                const loser = hWin ? d.guestAlias : d.hostAlias;
                rec = recordDuoWin(winner, loser);
            }

            // Streak badge
            if (rec.streak >= 2 && rec.streakHolder) {
                streakEl.innerHTML = `<div class="duo-streak-badge">🔥 ${rec.streakHolder} 連勝 ${rec.streak} 場！</div>`;
            } else {
                streakEl.innerHTML = '';
            }

            function makeCard(alias, time, stars, isWinner) {
                return `<div class="duo-result-card ${isWinner ? 'winner' : ''}">
                    <div class="duo-result-crown">${isWinner ? '👑' : ''}</div>
                    <div class="duo-result-alias">${alias || '--'}</div>
                    <div class="duo-result-time">${formatSeconds(time)}</div>
                    <div class="duo-result-stars">${stars ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : ''}</div>
                </div>`;
            }

            cardsEl.innerHTML =
                makeCard(d.hostAlias, hTime, d.hostStars, hWin) +
                makeCard(d.guestAlias, gTime, d.guestStars, gWin);

            if (isDraw) {
                diffEl.textContent = '平手！心有靈犀 💕';
            } else {
                const winnerAlias = hWin ? d.hostAlias : d.guestAlias;
                diffEl.textContent = `${winnerAlias} 快了 ${formatSeconds(diff)}`;
            }

            // Lifetime record
            const wins = rec.wins || {};
            const names = Object.keys(wins);
            if (names.length >= 2) {
                const sorted = names.sort((a, b) => wins[b] - wins[a]);
                recordEl.innerHTML = `歷史戰績：<span>${sorted[0]} ${wins[sorted[0]]}</span> 勝 — <span>${sorted[1]} ${wins[sorted[1]]}</span> 勝`;
            } else if (names.length === 1) {
                recordEl.innerHTML = `歷史戰績：<span>${names[0]} ${wins[names[0]]}</span> 勝`;
            } else {
                recordEl.innerHTML = '';
            }

            // Hide emoji bar
            document.getElementById('duo-emoji-bar').style.display = 'none';

            modal.style.display = 'flex';
        }

        // ===== Duo Records & Streaks =====
        function loadDuoRecords() {
            return JSON.parse(localStorage.getItem('sudoku_duo_records') || '{"wins":{},"streak":0,"streakHolder":""}');
        }
        function saveDuoRecords(data) {
            localStorage.setItem('sudoku_duo_records', JSON.stringify(data));
        }
        function recordDuoWin(winnerAlias, loserAlias) {
            const rec = loadDuoRecords();
            if (!rec.wins) rec.wins = {};
            rec.wins[winnerAlias] = (rec.wins[winnerAlias] || 0) + 1;
            if (!rec.wins[loserAlias]) rec.wins[loserAlias] = 0;
            // Update streak
            if (rec.streakHolder === winnerAlias) {
                rec.streak = (rec.streak || 0) + 1;
            } else {
                rec.streakHolder = winnerAlias;
                rec.streak = 1;
            }
            saveDuoRecords(rec);
            return rec;
        }
        function recordDuoDraw() {
            const rec = loadDuoRecords();
            rec.streak = 0;
            rec.streakHolder = '';
            saveDuoRecords(rec);
            return rec;
        }

        // ===== Duo Emoji Reactions =====
        let duoEmojiCooldown = 0;
        let duoLastEmojiSeen = '';

        function sendDuoEmoji(emoji) {
            if (!isDuoMode || !firebaseReady) return;
            const now = Date.now();
            if (now - duoEmojiCooldown < 1500) return; // cooldown 1.5s
            duoEmojiCooldown = now;
            const field = duoRole === 'host' ? 'hostEmoji' : 'guestEmoji';
            const tsField = duoRole === 'host' ? 'hostEmojiTs' : 'guestEmojiTs';
            duoRoomRef().update({
                [field]: emoji,
                [tsField]: Date.now()
            }).catch(() => {});
            // Show own emoji as confirmation
            spawnEmojiFloat(emoji, true);
        }

        function handleDuoEmoji(d) {
            if (!isDuoMode) return;
            const emojiField = duoRole === 'host' ? 'guestEmoji' : 'hostEmoji';
            const tsField = duoRole === 'host' ? 'guestEmojiTs' : 'hostEmojiTs';
            const emoji = d[emojiField];
            const ts = d[tsField];
            if (!emoji || !ts) return;
            const key = `${emoji}_${ts}`;
            if (key === duoLastEmojiSeen) return;
            duoLastEmojiSeen = key;
            spawnEmojiFloat(emoji, false);
        }

        function spawnEmojiFloat(emoji, isSelf) {
            const el = document.createElement('div');
            el.className = 'duo-emoji-float';
            el.textContent = emoji;
            // Self: rises from bottom-center, opponent: rises from top-center
            const x = 50 + (Math.random() - 0.5) * 30;
            if (isSelf) {
                el.style.bottom = '120px';
                el.style.left = `${x}%`;
            } else {
                el.style.top = '80px';
                el.style.left = `${x}%`;
                if (navigator.vibrate) navigator.vibrate(15);
            }
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        function closeDuoResult() {
            document.getElementById('duo-result-modal').style.display = 'none';
            // Mark room finished
            if (firebaseReady) {
                duoRoomRef().update({ status: 'finished' }).catch(() => {});
            }
            resetDuoState();
            showLevelScreen();
        }

        async function leaveDuoRoom() {
            if (!firebaseReady || !duoRole) { resetDuoState(); return; }
            try {
                if (duoRole === 'host') {
                    await duoRoomRef().update({ status: 'idle' });
                } else {
                    await duoRoomRef().update({
                        guestId: null, guestAlias: null, guestReady: false,
                        guestProgress: 0, guestFinishTime: null, guestStars: null,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            } catch (_) {}
            resetDuoState();
        }

        function resetDuoState() {
            isDuoMode = false;
            duoRole = null;

        // Passive glow listener for level screen
        function startDuoGlowListener() {
            if (!firebaseReady) return;
            if (duoGlowUnsubscribe) duoGlowUnsubscribe();
            duoGlowUnsubscribe = duoRoomRef().onSnapshot(snap => {
                // Remove old glow
                document.querySelectorAll('.level-item.duo-glow').forEach(el => el.classList.remove('duo-glow'));
                if (!snap.exists) return;
                const d = snap.data();
                if (d.status !== 'waiting' || !d.levelId) return;
                const { playerId } = getPlayerIdentity();
                if (d.hostId === playerId) return; // Don't glow my own room

                // Find the matching level card and make it glow
                const items = document.querySelectorAll('#level-list .level-item');
                const filtered = getFilteredLevels().filter(l => !l.hidden);
                filtered.forEach((l, i) => {
                    if (l.id === d.levelId && items[i]) {
                        items[i].classList.add('duo-glow');
                    }
                });
            }, () => {});

        function startTimer(reset = true) {
            clearInterval(timerInterval);
            if (reset) {
                seconds = 0;
                ghostIdx = 0;
                ghostFilledCount = 0;
                playerFilledCount = 0;
            }

            // Sync initial state if resumed or ghost mode active
            if (isGhostMode) {
                recalculatePlayerFilledCount();
                updateGhostEngine(seconds);
                updateGhostProgressUI();
            }

            updateTimerUI();
            timerInterval = setInterval(() => {
                seconds++;
                updateTimerUI();
                if (isGhostMode) {
                    updateGhostEngine(seconds);
                }
            }, 1000);
        }

        function recalculatePlayerFilledCount() {
            playerFilledCount = cellsData.filter(c => c.value !== 0).length;
        }

        function pauseGame() {
            clearInterval(timerInterval);
            const pauseScreen = document.getElementById('pause-screen');
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');

            document.getElementById('pause-level-name').textContent = currentLevel.displayName;
            document.getElementById('pause-timer').textContent = `${mins}:${secs}`;
            saveGameStatus();
            loadLevelLeaderboard(currentLevel.id);
            pauseScreen.style.display = 'flex';
        }

        function resumeGame() {
            document.getElementById('pause-screen').style.display = 'none';
            startTimer(false);
        }

        function updateTimerUI() {
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            timerEl.textContent = `${currentLevel.displayName} / ${mins}:${secs}`;
        }

        function initGame(levelId = 1, forceReset = false, playWithGhost = false, ghostData = null) {
            currentLevel = levels.find(l => l.id === levelId) || levels[0];
            closeReplayModal();
            localStorage.setItem('sudoku_last_level', String(currentLevel.id));

            // Ghost Setup
            isGhostMode = playWithGhost;
            ghostHistory = isGhostMode && ghostData ? ghostData : [];
            document.getElementById('ghost-progress-container').style.display = isGhostMode ? 'flex' : 'none';
            // Clean up any remaining ghost marks
            Array.from(gridEl.children).forEach(c => c.classList.remove('ghost-marked'));

            // 嘗試載入存檔
            const saved = forceReset ? null : loadGameStatus(currentLevel.id);

            if (saved) {
                cellsData = saved.cellsData;
                seconds = saved.seconds;
                errors = saved.errors;
                submissionCount = saved.submissionCount || 0;
                actionHistory = Array.isArray(saved.actionHistory) ? saved.actionHistory : [];
                if (saved.isGhostMode === true && saved.ghostHistory) {
                    // Resume ghost state
                    isGhostMode = true;
                    ghostHistory = saved.ghostHistory;
                    document.getElementById('ghost-progress-container').style.display = 'flex';
                }
            } else {
                errors = 0;
                seconds = 0;
                submissionCount = 0;
                actionHistory = [];
                cellsData = currentLevel.puzzle.map((val, idx) => ({
                    value: val,
                    fixed: val !== 0,
                    notes: [],
                    isError: false
                }));
            }

            updateLivesUI();
            overlay.style.display = 'none';
            document.getElementById('pause-screen').style.display = 'none';
            winCelebrationEl.style.display = 'none';
            renderGrid();
            startTimer(false); // 不重置，使用當前 seconds
            loadLevelLeaderboard(currentLevel.id);

            // Switch view
            document.getElementById('level-screen').style.display = 'none';
            document.querySelector('.game-container').style.display = 'flex';
        }

        function saveGameStatus() {
            if (!currentLevel) return;
            const data = {
                levelId: currentLevel.id,
                cellsData: cellsData,
                seconds: seconds,
                errors: errors,
                submissionCount: submissionCount,
                actionHistory: actionHistory,
                isGhostMode: isGhostMode,
                ghostHistory: isGhostMode ? ghostHistory : null
            };
            const prefix = isSpeedrunMode ? 'sudoku_speed_save_' : 'sudoku_save_';
            localStorage.setItem(`${prefix}${currentLevel.id}`, JSON.stringify(data));
            localStorage.setItem('sudoku_last_level', String(currentLevel.id));
        }

        function loadGameStatus(levelId) {
            const prefix = isSpeedrunMode ? 'sudoku_speed_save_' : 'sudoku_save_';
            const saved = localStorage.getItem(`${prefix}${levelId}`);
            return saved ? JSON.parse(saved) : null;
        }

        function clearGameStatus(levelId) {
            const prefix = isSpeedrunMode ? 'sudoku_speed_save_' : 'sudoku_save_';
            localStorage.removeItem(`${prefix}${levelId}`);

        function renderGrid() {
            gridEl.innerHTML = '';
            cellsData.forEach((data, i) => {
                const cell = document.createElement('div');
                cell.className = `cell ${data.fixed ? 'fixed' : ''} ${data.isError ? 'error' : ''}`;
                updateCellDisplay(cell, data);
                cell.onclick = () => selectCell(i);
                gridEl.appendChild(cell);
            });
            updateNumpadState();
        }

        function updateCellDisplay(cell, data) {
            cell.innerHTML = '';
            if (data.value !== 0) {
                cell.textContent = data.value;
                if (!data.fixed) cell.classList.add('user-val');
                else cell.classList.remove('user-val');
            } else {
                const ng = document.createElement('div');
                ng.className = 'notes-grid';
                for (let n = 1; n <= 9; n++) {
                    const nd = document.createElement('div');
                    nd.className = `note-num ${data.notes.includes(n) ? 'active' : ''}`;

        function showFeedback(msg, tone = 'neutral') {
            clearTimeout(feedbackTimer);
            feedbackToast.textContent = msg;
            feedbackToast.classList.remove('success', 'error');
            if (tone === 'success') feedbackToast.classList.add('success');
            if (tone === 'error') feedbackToast.classList.add('error');
            feedbackToast.classList.add('show');
            feedbackTimer = setTimeout(() => {
                feedbackToast.classList.remove('show');
            }, 900);
        }

        function playErrorFeedback() {
            if (navigator.vibrate) navigator.vibrate(120);
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = 180;
                gain.gain.value = 0.03;
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
                setTimeout(() => ctx.close(), 150);
            } catch (_) {
                // Ignore audio errors silently.
            }
        }

        // ===== Zen Audio Feedback =====
        let _audioCtx = null;
        function getAudioCtx() {
            try {
                if (!_audioCtx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return null;
                    _audioCtx = new AC();
                }
                if (_audioCtx.state === 'suspended') _audioCtx.resume();
                return _audioCtx;
            } catch (_) { return null; }
        }

        function playFillSound() {
            const ctx = getAudioCtx();
            if (!ctx) return;
            try {
                const t = ctx.currentTime;
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(698, t);       // F5
                osc.frequency.exponentialRampToValueAtTime(784, t + 0.06); // → G5 微升
                g.gain.setValueAtTime(0.025, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.connect(g); g.connect(ctx.destination);
                osc.start(t); osc.stop(t + 0.1);
            } catch (_) {}
        }

        function playUnitCompleteSound() {
            const ctx = getAudioCtx();
            if (!ctx) return;
            try {
                const t = ctx.currentTime;
                // 柔和雙音：D5 → A5（純五度），如風鈴
                [[587, t + 0.04], [880, t + 0.14]].forEach(([freq, start]) => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    g.gain.setValueAtTime(0, start);
                    g.gain.linearRampToValueAtTime(0.035, start + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(start); osc.stop(start + 0.35);
                });
            } catch (_) {}
        }

        function playWinSound() {
            const ctx = getAudioCtx();
            if (!ctx) return;
            try {
                const t = ctx.currentTime;
                // C大調琶音 C5→E5→G5→C6，溫潤綻放
                [523, 659, 784, 1047].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const g = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    const start = t + i * 0.13;
                    g.gain.setValueAtTime(0, start);
                    g.gain.linearRampToValueAtTime(0.03, start + 0.03);
                    g.gain.exponentialRampToValueAtTime(0.001, start + 0.7);
                    osc.connect(g); g.connect(ctx.destination);
                    osc.start(start); osc.stop(start + 0.7);
                });
            } catch (_) {}
        }

        function markErrorArea(idx) {
            const row = Math.floor(idx / 9), col = idx % 9;
            const box = Math.floor(row / 3) * 3 + Math.floor(col / 3);
            Array.from(gridEl.children).forEach((c, i) => {
                const r = Math.floor(i / 9), cc = i % 9, b = Math.floor(r / 3) * 3 + Math.floor(cc / 3);
                if (i === idx) {
                    c.classList.add('error-strong');
                    return;
                }
                if (r === row || cc === col || b === box) {
                    c.classList.add('error-peer');
                }
            });
            livesEl.classList.remove('hit');
            void livesEl.offsetWidth;
            livesEl.classList.add('hit');
            setTimeout(() => {
                Array.from(gridEl.children).forEach(c => c.classList.remove('error-strong', 'error-peer'));
                livesEl.classList.remove('hit');
            }, 650);
        }

        function getUnitIndices(idx) {
            const row = Math.floor(idx / 9);
            const col = idx % 9;
            const boxRow = Math.floor(row / 3) * 3;
            const boxCol = Math.floor(col / 3) * 3;

            const rowIndices = Array.from({ length: 9 }, (_, i) => row * 9 + i);
            const colIndices = Array.from({ length: 9 }, (_, i) => i * 9 + col);
            const boxIndices = [];
            for (let r = boxRow; r < boxRow + 3; r++) {
                for (let c = boxCol; c < boxCol + 3; c++) {
                    boxIndices.push(r * 9 + c);
                }
            }
            return { rowIndices, colIndices, boxIndices };
        }

        function isUnitComplete(indices) {
            return indices.every(i => cellsData[i].value !== 0);
        }

        function celebrateCompletedUnits(idx, beforeState) {
            const { rowIndices, colIndices, boxIndices } = getUnitIndices(idx);
            const afterRow = isUnitComplete(rowIndices);
            const afterCol = isUnitComplete(colIndices);
            const afterBox = isUnitComplete(boxIndices);

            const justCompletedRow = !beforeState.row && afterRow;
            const justCompletedCol = !beforeState.col && afterCol;
            const justCompletedBox = !beforeState.box && afterBox;

            if (!justCompletedRow && !justCompletedCol && !justCompletedBox) return;

            const flashSet = new Set();
            if (justCompletedRow) rowIndices.forEach(i => flashSet.add(i));
            if (justCompletedCol) colIndices.forEach(i => flashSet.add(i));
            if (justCompletedBox) boxIndices.forEach(i => flashSet.add(i));

            flashSet.forEach(i => gridEl.children[i].classList.add('unit-complete'));
            setTimeout(() => {
                flashSet.forEach(i => gridEl.children[i].classList.remove('unit-complete'));
            }, 560);

            const parts = [];
            if (justCompletedRow) parts.push('一列');
            if (justCompletedCol) parts.push('一欄');
            if (justCompletedBox) parts.push('一宮');
            showFeedback(`完成 ${parts.join(' + ')}！`, 'success');
            playUnitCompleteSound();
            if (navigator.vibrate) navigator.vibrate([12, 30, 12]);
        }

        function handleInput(num) {
            if (selectedIdx === null || cellsData[selectedIdx].fixed || errors >= maxErrors) return;

            let data = cellsData[selectedIdx];
            const cellEl = gridEl.children[selectedIdx];

            if (isNotesMode) {
                if (data.value !== 0) return;
                const ni = data.notes.indexOf(num);
                if (ni > -1) data.notes.splice(ni, 1);
                else data.notes.push(num);
                recordAction('note', `${cellLabel(selectedIdx)} 候選 ${num}${ni > -1 ? ' 取消' : ' 加入'}`, selectedIdx, null, data.notes);
            } else {
                if (isSpeedrunMode) {
                    data.value = num;
                    data.notes = [];
                    data.isError = false;
                    recordAction('fill', `${cellLabel(selectedIdx)} (競速) 填入 ${num}`, selectedIdx, num);
                    playFillSound();
                    updateCellDisplay(cellEl, data);
                    saveGameStatus();
                    updateNumpadState();
                    if (isDuoMode) updateDuoProgress();
                    checkSpeedrunComplete(selectedIdx);
                    return;
                }

                if (num !== currentLevel.solution[selectedIdx]) {
                    errors++;
                    updateLivesUI();
                    data.isError = true;
                    cellEl.classList.add('error');
                    const originalValue = data.value;
                    const originalNotes = data.notes.slice();
                    data.value = num;
                    data.notes = [];
                    cellEl.classList.add('wrong-preview');
                    updateCellDisplay(cellEl, data);
                    markErrorArea(selectedIdx);
                    showFeedback(`錯誤！${3 - errors} 次機會剩餘`, 'error');
                    playErrorFeedback();
                    recordAction('mistake', `${cellLabel(selectedIdx)} 輸入 ${num}（錯誤）`, selectedIdx, num);
                    setTimeout(() => {
                        data.isError = false;
                        cellEl.classList.remove('error');
                        cellEl.classList.remove('wrong-preview');
                        data.value = originalValue;
                        data.notes = originalNotes;
                        updateCellDisplay(cellEl, data);
                    }, 400);
                    saveGameStatus();
                    if (errors >= maxErrors) showGameOver();
                    return;
                }
                const { rowIndices, colIndices, boxIndices } = getUnitIndices(selectedIdx);
                const beforeState = {
                    row: isUnitComplete(rowIndices),
                    col: isUnitComplete(colIndices),
                    box: isUnitComplete(boxIndices),
                };
                cellsData[selectedIdx].value = num;
                cellsData[selectedIdx].notes = [];
                cellsData[selectedIdx].isError = false;
                recordAction('fill', `${cellLabel(selectedIdx)} 填入 ${num}`, selectedIdx, num);
                playFillSound();
                if (navigator.vibrate) navigator.vibrate(8);

                if (isGhostMode) {
                    recalculatePlayerFilledCount();
                    updateGhostProgressUI();
                }

                if (!isSpeedrunMode) {
                    celebrateCompletedUnits(selectedIdx, beforeState);
                }
                if (isDuoMode) updateDuoProgress();
                checkWin();
            }
            updateCellDisplay(cellEl, data);
            saveGameStatus();
            updateNumpadState();

            // 讓輸入後能立刻高亮盤面上其他相同的數字
            selectCell(selectedIdx);
        }

        function checkSpeedrunComplete(lastIdx) {
            const isFull = cellsData.every(c => c.value !== 0);
            if (!isFull) return;

            let isCorrect = true;
            for (let i = 0; i < 81; i++) {
                if (cellsData[i].value !== currentLevel.solution[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                checkWin();
            } else {
                submissionCount++;
                showFeedback(`盤面有誤！已重置最後一步 (第 ${submissionCount} 次提交)`, 'error');
                playErrorFeedback();

                Array.from(gridEl.children).forEach(c => c.classList.add('error-strong'));
                setTimeout(() => {
                    Array.from(gridEl.children).forEach(c => c.classList.remove('error-strong'));
                }, 500);

                if (lastIdx !== null) {
                    cellsData[lastIdx].value = 0;
                    cellsData[lastIdx].isError = true;
                    const cellEl = gridEl.children[lastIdx];
                    cellEl.classList.add('error');
                    updateCellDisplay(cellEl, cellsData[lastIdx]);

                    setTimeout(() => {
                        cellsData[lastIdx].isError = false;
                        cellEl.classList.remove('error');
                        updateCellDisplay(cellEl, cellsData[lastIdx]);
                    }, 400);

                    saveGameStatus();
                    updateNumpadState();
                }
            }
        }

        let achievementToastQueue = [];

        function loadAchievements() {
            return JSON.parse(localStorage.getItem('sudoku_achievements') || '{}');
        }

        function saveAchievementsData(data) {
            localStorage.setItem('sudoku_achievements', JSON.stringify(data));
        }

        function unlockAchievement(id) {
            const data = loadAchievements();
            if (data[id]) return false;
            data[id] = { date: new Date().toISOString().slice(0, 10) };
            saveAchievementsData(data);
            const a = ACHIEVEMENTS.find(x => x.id === id);
            if (a) achievementToastQueue.push(a);
            return true;
        }

        function processAchievementToasts() {
            if (achievementToastActive || !achievementToastQueue.length) return;
            achievementToastActive = true;
            const a = achievementToastQueue.shift();
            const toast = document.getElementById('achievement-toast');
            if (!toast) { achievementToastActive = false; return; }
            document.getElementById('achievement-toast-icon').textContent = a.icon;
            document.getElementById('achievement-toast-name').textContent = a.name;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
                achievementToastActive = false;
                if (achievementToastQueue.length) setTimeout(processAchievementToasts, 400);
            }, 3000);
        }

        function computeStats() {
            const records = JSON.parse(localStorage.getItem('sudoku_records') || '{}');
            const speedRecords = JSON.parse(localStorage.getItem('sudoku_speed_records') || '{}');
            const mainLevels = levels.filter(l => !l.hidden);

            let totalCleared = 0, totalTime = 0, totalStars = 0, threeStarCount = 0;
            let fastestTime = Infinity, fastestLevel = null;

            for (const [id, rec] of Object.entries(records)) {
                const time = typeof rec === 'number' ? rec : rec.time;
                const stars = typeof rec === 'number' ? 1 : (rec.stars || 1);
                totalCleared++;
                totalTime += time;
                totalStars += stars;
                if (stars === 3) threeStarCount++;
                if (time < fastestTime) {
                    fastestTime = time;
                    fastestLevel = levels.find(l => l.id === Number(id));
                }
            }

            const TIER_NAMES = ['初心者', '禪', '虛空', '無我', '本源', '寂滅', '空鏡', '星潮', '玄鏈'];
            const tierStats = TIER_NAMES.map((name, i) => {
                const tierLevels = mainLevels.filter(l => l.stars === i);
                const tierCleared = tierLevels.filter(l => records[l.id]).length;
                return { name, total: tierLevels.length, cleared: tierCleared };
            });

            return {
                totalCleared, totalLevels: mainLevels.length,
                threeStarCount, totalStars, maxStars: mainLevels.length * 3,
                totalTime, avgTime: totalCleared > 0 ? Math.round(totalTime / totalCleared) : 0,
                fastestTime: fastestTime === Infinity ? 0 : fastestTime, fastestLevel,
                speedrunCleared: Object.keys(speedRecords).length,
                tierStats, records, speedRecords
            };
        }

        function checkAllAchievements() {
            const stats = computeStats();
            const { totalCleared, threeStarCount, records, speedRecords, tierStats } = stats;

            if (totalCleared >= 1) unlockAchievement('first_clear');
            if (threeStarCount >= 1) unlockAchievement('perfect_one');
            if (threeStarCount >= 10) unlockAchievement('perfect_10');
            if (threeStarCount >= 50) unlockAchievement('perfect_50');
            if (totalCleared >= 10) unlockAchievement('clear_10');
            if (totalCleared >= 50) unlockAchievement('clear_50');
            if (totalCleared >= 100) unlockAchievement('clear_100');

            const mainLevels = levels.filter(l => !l.hidden);
            if (mainLevels.length > 0 && mainLevels.every(l => records[l.id])) unlockAchievement('clear_all');

            for (const rec of Object.values(records)) {
                const t = typeof rec === 'number' ? rec : rec.time;
                if (t <= 120) unlockAchievement('speed_2min');
                if (t <= 60) unlockAchievement('speed_1min');
            }

            if (tierStats[0].total > 0 && tierStats[0].cleared >= tierStats[0].total) unlockAchievement('tier_beginner');
            if (tierStats.some(t => t.total > 0 && t.cleared >= t.total)) unlockAchievement('tier_any');

            const clearedIds = new Set(Object.keys(records).map(Number));
            if ([...clearedIds].some(id => { const l = levels.find(x => x.id === id); return l && l.stars === 5; })) unlockAchievement('nirvana_clear');
            if ([...clearedIds].some(id => { const l = levels.find(x => x.id === id); return l && l.stars === 6; })) unlockAchievement('xy_master');
            if ([...clearedIds].some(id => { const l = levels.find(x => x.id === id); return l && l.stars === 7; })) unlockAchievement('swordfish');
            if ([...clearedIds].some(id => { const l = levels.find(x => x.id === id); return l && l.stars === 8; })) unlockAchievement('aic_master');

            if (Object.keys(speedRecords).length > 0) unlockAchievement('speedrun_first');

            processAchievementToasts();
        }

        function saveProgress() {
            if (isSpeedrunMode) {
                const records = JSON.parse(localStorage.getItem('sudoku_speed_records') || '{}');
                const existing = records[currentLevel.id];
                const currentSubs = submissionCount + 1; // 包含本次成功的提交

                const shouldUpdate = !existing ||
                    currentSubs < (existing.submissions || Infinity) ||
                    (currentSubs === (existing.submissions || Infinity) && seconds < (existing.time || Infinity));

                if (shouldUpdate) {
                    records[currentLevel.id] = { time: seconds, submissions: currentSubs, replayHistory: actionHistory };
                    localStorage.setItem('sudoku_speed_records', JSON.stringify(records));
                }
                return currentSubs;
            } else {
                const records = JSON.parse(localStorage.getItem('sudoku_records') || '{}');
                const existing = records[currentLevel.id];

                // 計算星數 (0錯=3星, 1錯=2星, 2錯=1星)
                const earnedStars = Math.max(1, 3 - errors);

                // 檢查是否更新紀錄（以星數優先，其次是時間）
                const shouldUpdate = !existing ||
                    earnedStars > (existing.stars || 1) ||
                    (earnedStars === (existing.stars || 1) && seconds < (existing.time || Infinity));

                if (shouldUpdate) {
                    records[currentLevel.id] = {
                        time: seconds,
                        stars: earnedStars,
                        replayHistory: actionHistory
                    };
                    localStorage.setItem('sudoku_records', JSON.stringify(records));
                }
                return earnedStars;
            }
        }

            try {
                const snap = await db.collection('level_first_clears')
                    .doc(String(levelId))
                    .collection('players')
                    .orderBy('firstTimeSec', 'asc')
                    .limit(3)
                    .get();
                const rows = snap.docs.map(d => d.data());
                if (!rows.length) {
                    preLevelLeaderboardEl.textContent = '尚無玩家首通紀錄';
                } else {
                    preLevelLeaderboardEl.innerHTML = rows.map((r, i) => {

                        if (isSpeedrunMode) {

                        return `${i + 1}. ${r.alias}  ${timeStr}  ${'★'.repeat(r.firstStars)}`;
                    }).join('<br>');
                }
            } catch (e) {
                console.warn('load pre-level leaderboard failed:', e);

        function hashStringToSeed(str) {
            let h = 2166136261;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            return h >>> 0;
        }

            const seed = hashStringToSeed(key);
            const idx = seed % pool.length;
            showPreLevelModal(pool[idx].id);
        }

        function buildMidMasterPool() {
            // 進階(無我) ~ 大師(空鏡) 之間：無我(3)、本源(4)、寂滅(5)
            const eligibleStars = new Set([3, 4, 5]);
            const eligible = levels.filter(l => eligibleStars.has(l.stars));
            if (!eligible.length) return [];
            const seed = hashStringToSeed('mid_master_pool_v1');
            const scored = eligible.map(l => ({
                level: l,
                score: hashStringToSeed(`${seed}-${l.id}`)
            }));
            scored.sort((a, b) => a.score - b.score);
            return scored.slice(0, 100).map(s => s.level);
        }

            // 過濾出尚未通關的關卡
            const unplayedPool = midPoolLevels.filter(l => !records[l.id]);

            let pool = unplayedPool;
            if (!unplayedPool.length) {

                pool = midPoolLevels;

                    c.classList.add('selected');

                    if (selectedVal !== 0 && val === selectedVal) {

            numButtons.forEach((btn, i) => {

                btn.classList.toggle('completed', counts[n] >= 9);

        const np = document.getElementById('numpad');

            b.className = 'num-btn';
            b.textContent = i;
            // 使用 mousedown / touchstart 讓觸發更及時，同時防止右鍵選單
            b.addEventListener('pointerdown', (ev) => {
                if (ev && ev.button !== undefined && ev.button !== 0) return;
                handleInput(i);
            });
            b.addEventListener('contextmenu', (e) => e.preventDefault());
            numButtons.push(b);
            np.appendChild(b);
        }

        window.addEventListener('keydown', (e) => {
            if (e.key >= 1 && e.key <= 9) handleInput(parseInt(e.key));
            if (e.key === 'Backspace') erase();
        });

        // Init Theme
        const savedTheme = localStorage.getItem('sudoku_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        const APP_VERSION = '2026.03.21-V1';
        document.getElementById('version-badge').textContent = `v${APP_VERSION}`;

        function enforceAppVersion() {
            const key = 'sudoku_app_version';
            const stored = localStorage.getItem(key);
            if (stored === APP_VERSION) return Promise.resolve(false);

            localStorage.setItem(key, APP_VERSION);
            if ('serviceWorker' in navigator) {
                return navigator.serviceWorker.getRegistrations()
                    .then((regs) => Promise.all(regs.map((r) => r.unregister())))
                    .then(() => {
                        if ('caches' in window) {
                            return caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))));
                        }
                    })
                    .then(() => {
                        window.location.reload();
                        return true;
                    })
                    .catch(() => {
                        window.location.reload();
                        return true;
                    });
            } else {
                window.location.reload();
                return Promise.resolve(true);
            }
        }

        // Initialize Service Worker and Handle Updates
        if ('serviceWorker' in navigator) {
            // 監聽 controllerchange，當新的 SW 接管時執行重新載入
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });

            navigator.serviceWorker.register('sw.js').then(reg => {
                // 如果頁面載入時已經有等待中的 SW
                if (reg.waiting) {
                    offerUpdate(reg.waiting);
                }

                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    installingWorker.onstatechange = () => {
                        if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            offerUpdate(installingWorker);
                        }
                    };
                };

                // 每小時自動檢查一次更新
                setInterval(() => reg.update(), 1000 * 60 * 60);

            }).catch(err => console.error('SW init fail:', err));

            function offerUpdate(worker) {
                // 使用延遲確保 UI 穩定後再提示
                setTimeout(() => {
                    if (confirm('發現新的版本與關卡！是否立即更新以體驗最新內容？')) {
                        worker.postMessage({ type: 'SKIP_WAITING' });
                    }
                }, 1000);
            }
        }

        // 執行版本檢查
        enforceAppVersion();
        initFirebase();
        if (firebaseReady) startDuoGlowListener();
        loadAliasToInput();
        if (aliasInputEl) {
            aliasInputEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') saveAlias();
            });
        }
        if (replayModalEl) {
            replayModalEl.addEventListener('click', (e) => {
                if (e.target === replayModalEl) closeReplayModal();
            });
        }
        const statsModalEl = document.getElementById('stats-modal');
        if (statsModalEl) {
            statsModalEl.addEventListener('click', (e) => {
                if (e.target === statsModalEl) closeStatsModal();
            });
        }
        const duoResultModalEl = document.getElementById('duo-result-modal');
        if (duoResultModalEl) {
            duoResultModalEl.addEventListener('click', (e) => {
                if (e.target === duoResultModalEl) closeDuoResult();
            });
        }
        window.addEventListener('beforeunload', () => {
            if (document.querySelector('.game-container').style.display === 'flex') {
                saveGameStatus();
            }
            // Best-effort cleanup on page close
            if (isDuoMode && firebaseReady && duoRole) {
                const field = duoRole === 'host' ? 'status' : 'guestId';
                const val = duoRole === 'host' ? 'idle' : null;
                navigator.sendBeacon && duoRoomRef().update({ [field]: val }).catch(() => {});
            }
        });
        window.addEventListener('resize', () => {
            if (document.getElementById('level-screen').style.display === 'flex') {
                requestAnimationFrame(syncLevelCardSize);
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && document.querySelector('.game-container').style.display === 'flex') {
                saveGameStatus();
            }
        });
        showLevelScreen();
        maybeResumeLastGame();
    </script>
</body>

</html>
