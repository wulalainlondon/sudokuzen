<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0">
    <title>Minimal Sudoku Pro - Elegant Zen Puzzle</title>
    <meta name="description"
        content="A clean, minimalist Sudoku game featuring a premium life system, dark mode, and zen design. Play Sudoku online with a professional interface.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0984E3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Sudoku Zen">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="level-screen">
        <div id="resume-banner" class="resume-banner hidden"></div>
        <div class="level-screen-header">
            <div class="level-brand">
                <h1 class="level-title" id="level-title">SUDOKU ZEN</h1>
                <span class="level-mode-chip hidden" id="level-mode-chip">WORLD</span>
            </div>
            <div class="level-header-actions">
                <button id="library-btn" class="header-icon-btn" onclick="openLibraryOverlay()" title="境界秘笈"
                    aria-label="境界秘笈">📚</button>
                <button id="stats-btn" class="header-icon-btn" onclick="openStatsModal()" title="個人統計與成就"
                    aria-label="個人統計">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
                </button>
                <button id="duo-entry-btn" class="header-icon-btn speedrun-btn" onclick="openDuoLobby()" title="雙人對決大廳"
                    aria-label="雙人對決入口">Duo</button>
            </div>
        </div>
        <div class="alias-config">
            <input id="alias-input" class="alias-input" type="text" maxlength="24" placeholder="輸入你的暱稱（1~24字）" />
            <button class="alias-save-btn" onclick="saveAlias()">儲存暱稱</button>
        </div>
        <div class="tabs-container"></div>
        <div id="stage-view">
            <div class="stage-map" id="stage-map"></div>
            <div class="random-bar">
                <button class="random-btn practice-entry-btn" onclick="openPracticeLobby()">
                    <span class="practice-entry-main">修行</span>
                    <span class="practice-entry-sub">41 技法 · 精準磨練</span>
                </button>
                <button class="random-btn world-entry-btn" onclick="openWildLobby()">
                    <span class="world-entry-main">世界</span>
                    <span class="world-entry-sub">隨機遭遇 · 十輪修行</span>
                </button>
            </div>
        </div>
        <!-- Practice Mode is now rendered by React (src/react/practice/PracticeTree.tsx) -->
        <!-- Wild Mode Lobby -->
        <div id="wild-lobby" class="hidden">
            <div class="wild-lobby-header">
                <button class="tier-back-btn" onclick="closeWildLobby()">← 返回</button>
                <div class="wild-lobby-title">世界</div>
            </div>
            <div class="wild-lobby-body">
                <!-- Profile Card -->
                <div class="wild-profile-card">
                    <div class="wild-online-indicator" id="wild-online-count"></div>
                    <div class="wild-profile-level">
                        <span class="wild-level-badge" id="wild-level">Lv.1</span>
                        <span class="wild-level-title" id="wild-level-title">見習修士</span>
                        <div class="wild-title-display" id="wild-title"></div>
                    </div>
                    <div class="wild-exp-bar-wrap">
                        <div class="wild-exp-fill" id="wild-exp-fill"></div>
                    </div>
                    <div class="wild-exp-text" id="wild-exp-text">0 / 50 EXP</div>
                    <div class="wild-profile-stats">
                        <div class="wild-stat"><span class="wild-stat-num" id="wild-completed">0</span><span class="wild-stat-label">狩獵數</span></div>
                        <div class="wild-stat"><span class="wild-stat-num" id="wild-discovered">0</span><span class="wild-stat-label">圖鑑</span></div>
                        <div class="wild-stat"><span class="wild-stat-num" id="wild-encounters">0</span><span class="wild-stat-label">遭遇數</span></div>
                    </div>
                </div>
                <div class="wild-session-card">
                    <div class="wild-session-head">
                        <div class="wild-session-title">修行輪進度</div>
                        <div class="wild-session-round" id="wild-session-round">新修行輪</div>
                    </div>
                    <div class="wild-session-bar-wrap"><div class="wild-session-bar-fill" id="wild-session-fill"></div></div>
                    <div class="wild-session-meta" id="wild-session-meta">啟動後將進入 10 輪連續遭遇</div>
                    <div class="wild-session-tech" id="wild-session-tech">本輪尚未遭遇任何技巧</div>
                </div>
                <!-- Auto-Cast Toggle -->
                <div class="wild-autocast-row">
                    <label class="wild-autocast-label" for="wild-autocast-toggle">
                        <span class="wild-autocast-text">精通技巧自動施放</span>
                        <span class="wild-autocast-hint" id="wild-autocast-hint">已精通的技巧將自動推演</span>
                    </label>
                    <button class="wild-toggle-btn" id="wild-autocast-toggle" onclick="toggleWildAutoCast()" role="switch" aria-checked="true">
                        <span class="wild-toggle-knob"></span>
                    </button>
                </div>
                <!-- Enter Button -->
                <button class="wild-enter-btn" id="wild-enter-btn">
                    <span class="wild-enter-chip" id="wild-enter-chip">穩定遭遇池</span>
                    <span class="wild-enter-text">進入世界</span>
                    <span class="wild-enter-sub" id="wild-enter-sub">隨機遭遇 · 技巧修煉</span>
                </button>
                <!-- Bestiary Preview -->
                <div class="wild-bestiary-section">
                    <div class="wild-bestiary-title">妖獸圖鑑 <span id="wild-bestiary-count">0 / 40</span></div>
                    <div class="wild-bestiary-controls" id="wild-bestiary-controls">
                        <button class="wild-filter-btn active" data-filter="all">全部</button>
                        <button class="wild-filter-btn" data-filter="discovered">已發現</button>
                        <button class="wild-filter-btn" data-filter="conquered">已討伐</button>
                    </div>
                    <div class="wild-rarity-controls" id="wild-rarity-controls">
                        <button class="wild-rarity-btn active" data-rarity="all">全稀有度</button>
                        <button class="wild-rarity-btn" data-rarity="common">常見</button>
                        <button class="wild-rarity-btn" data-rarity="rare">稀有</button>
                        <button class="wild-rarity-btn" data-rarity="legendary">傳說</button>
                        <button class="wild-rarity-btn" data-rarity="mythic">神話</button>
                    </div>
                    <div class="wild-bestiary-grid" id="wild-bestiary-grid"></div>
                </div>
            </div>
        </div>
        <div id="duo-lobby" class="hidden">
            <div class="wild-lobby-header">
                <button class="tier-back-btn" id="duo-back-btn" onclick="closeDuoLobby()">← 返回</button>
                <div class="wild-lobby-title" id="duo-lobby-title">Duo 對戰大廳</div>
                <div class="wild-online-indicator" id="duo-conn-state"></div>
            </div>
            <div class="wild-lobby-body">
                <div class="wild-profile-card duo-lobby-card">
                    <div class="wild-session-title" id="duo-create-title">建立房間</div>
                    <label class="duo-level-label" id="duo-level-label" for="duo-level-select">選擇關卡</label>
                    <select id="duo-level-select" class="duo-level-select"></select>
                    <div class="duo-host-tools">
                        <button class="wild-filter-btn" id="duo-update-level-btn" onclick="updateDuoRoomLevelFromLobby()">更新房間關卡</button>
                        <button class="wild-filter-btn" id="duo-lock-level-btn" onclick="toggleDuoLevelLockFromLobby()">鎖定關卡</button>
                    </div>
                    <button class="wild-enter-btn duo-lobby-create" onclick="createDuoRoomFromLobby()">
                        <span class="wild-enter-chip" id="duo-host-chip">HOST</span>
                        <span class="wild-enter-text" id="duo-create-btn-text">建立房間</span>
                        <span class="wild-enter-sub" id="duo-create-btn-sub">建立後會進入對戰準備區</span>
                    </button>
                    <div class="wild-session-meta" id="duo-room-id-text"></div>
                </div>
                <div class="wild-session-card duo-lobby-card">
                    <div class="wild-session-head">
                        <div class="wild-session-title" id="duo-join-title">加入房間</div>
                        <button class="wild-filter-btn" id="duo-refresh-btn" onclick="refreshDuoLobbyRoom()">重新整理</button>
                    </div>
                    <div class="wild-session-meta" id="duo-room-status">讀取中...</div>
                    <div id="duo-room-list" class="duo-room-list"></div>
                    <button class="wild-enter-btn duo-lobby-join" id="duo-join-btn" onclick="joinDuoRoomFromLobby()">
                        <span class="wild-enter-chip" id="duo-join-chip">JOIN</span>
                        <span class="wild-enter-text" id="duo-join-btn-text">加入等待房</span>
                        <span class="wild-enter-sub" id="duo-join-btn-sub">與對方同一入口，直接加入對戰</span>
                    </button>
                </div>
                <div class="wild-session-card duo-lobby-card">
                    <div class="wild-session-head">
                        <div class="wild-session-title" id="duo-ready-title">對戰準備</div>
                    </div>
                    <div id="duo-ready-zone-host"></div>
                </div>
            </div>
        </div>
        <div id="tier-view" class="hidden">
            <div class="tier-header">
                <button class="tier-back-btn" onclick="backToStageMap()">← 返回</button>
                <div class="tier-title" id="tier-title"></div>
                <button class="teach-book-btn hidden" id="tier-teach-btn" title="境界秘笈">📖</button>
                <div class="tier-progress-text" id="tier-progress-text"></div>
            </div>
            <div id="level-list"></div>
        </div>
        <div class="version-badge" id="version-badge">v--</div>
    </div>

    <!-- Library Overlay is now rendered by React (src/react/library/LibraryOverlay.tsx) -->

    <!-- Pre-level Modal is now rendered by React (src/react/prelevel/PreLevelModal.tsx) -->
    <!-- Duo Ready Zone lives here as hidden DOM; React mounts it via ref when needed -->
    <div class="duo-ready-zone hidden" id="duo-ready-zone">
        <div class="duo-zone-title">💑 雙人對決</div>
        <div class="duo-player-slots">
            <div class="duo-player-slot" id="duo-slot-host">
                <div class="duo-slot-alias" id="duo-host-alias">--</div>
                <div class="duo-slot-title" id="duo-host-title"></div>
                <div class="duo-slot-status" id="duo-host-status">等待中</div>
            </div>
            <div class="duo-player-slot empty" id="duo-slot-guest">
                <div class="duo-slot-alias" id="duo-guest-alias">等待加入...</div>
                <div class="duo-slot-title" id="duo-guest-title"></div>
                <div class="duo-slot-status" id="duo-guest-status"></div>
            </div>
        </div>
        <div id="duo-pre-streak"></div>
        <div id="duo-countdown-area" class="hidden"></div>
        <button class="duo-ready-btn" id="duo-ready-btn" onclick="toggleDuoReady()">準備完成</button>
    </div>

    <div class="game-container">
        <!-- Game Over overlay is now rendered by React (src/react/gameover/GameOverOverlay.tsx) -->

        <div id="pause-screen">
            <h2 id="pause-level-name">LEVEL NAME</h2>
            <p id="pause-timer">00:00</p>
            <div class="leaderboard-card">
                <div class="leaderboard-title">首通榜 TOP 3</div>
                <div class="leaderboard-list" id="leaderboard-list">載入中...</div>
            </div>
            <button class="resume-btn" id="pause-resume-btn" onclick="resumeGame()">繼續遊戲</button>
            <button class="back-btn back-btn-light" id="pause-leave-btn" onclick="showLevelScreen(true)">放棄關卡</button>
            <button class="back-btn back-btn-light" id="pause-abandon-btn" style="display:none;">放棄遭遇</button>
        </div>

        <!-- Win celebration is now rendered by React (src/react/win/WinCelebration.tsx) -->

        <!-- 1. 頂部標題與 Quit 按鈕 -->
        <header>
            <div class="game-title-wrap">
                <h1 id="game-title">SUDOKU</h1>
                <span class="game-mode-chip hidden" id="game-mode-chip">WORLD</span>
            </div>
            <div class="header-controls">
                <button class="header-btn" onclick="pauseGame()" aria-label="Pause Game">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                </button>
                <button class="quit-btn" id="quit-btn" onclick="showLevelScreen(true)">Quit</button>
            </div>
        </header>

        <!-- 2. 數獨格上方資訊列 (對齊格子的左右兩端) -->
        <div class="grid-info-bar">
            <div class="stats" id="timer">ZEN / 00:00</div>
            <div class="ghost-progress-container hidden" id="ghost-progress-container">
                <span id="ghost-progress-text">👻 0 | 🧑 0</span>
            </div>
            <div class="duo-progress-container" id="duo-progress-container">
                <span id="duo-progress-text">💕 0/81</span>
                <div class="duo-progress-bar-wrap"><div class="duo-progress-fill" id="duo-progress-fill"></div></div>
            </div>
            <div class="grid-right">
                <div class="grid-actions">
                    <button class="mini-btn" id="continuous-fill-toggle" onclick="toggleContinuousFill()" aria-label="連續填入模式">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2v8" />
                            <path d="M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" />
                            <path d="M12 18v4" />
                        </svg>
                    </button>
                    <button class="mini-btn" id="note-toggle" onclick="toggleNoteMode()" aria-label="Toggle Notes">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                            <path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                        </svg>
                    </button>
                    <button class="mini-btn" onclick="erase()" aria-label="Erase">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                    </button>
                    <button class="mini-btn hidden" id="undo-btn" onclick="undoAction()" aria-label="Undo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 10h13a4 4 0 0 1 0 8H7" />
                            <path d="M3 10l4-4" />
                            <path d="M3 10l4 4" />
                        </svg>
                    </button>
                </div>
                <div class="life-container" id="lives"></div>
            </div>
        </div>

        <!-- 3. 數獨主網格 -->
        <div class="sudoku-grid" id="grid"></div>

        <div class="numpad-skill-wrapper">
            <div class="numpad" id="numpad"></div>
            <div class="skill-panel hidden" id="skill-panel">
                <div class="skill-subtitle" id="skill-subtitle"></div>
                <div class="skill-status" id="skill-status"></div>
                <div class="skill-actions">
                    <button class="skill-cast-btn" id="skill-cast-btn" onclick="castSkill()" disabled>施放</button>
                    <button class="skill-fill-btn" id="skill-fill-btn" onclick="fillAllCandidates()" aria-label="領域展開" title="領域展開：填入所有合法候選">領域展開</button>
                    <button class="skill-cancel-btn" onclick="exitSkillMode()">取消</button>
                </div>
            </div>
        </div>
        <div class="duo-emoji-bar" id="duo-emoji-bar">
            <button class="duo-emoji-btn" onclick="sendDuoEmoji('💪')">💪</button>
            <button class="duo-emoji-btn" onclick="sendDuoEmoji('😱')">😱</button>
            <button class="duo-emoji-btn" onclick="sendDuoEmoji('😂')">😂</button>
            <button class="duo-emoji-btn" onclick="sendDuoEmoji('💕')">💕</button>
            <button class="duo-emoji-btn" onclick="sendDuoEmoji('🔥')">🔥</button>
        </div>
        <div class="controls">
    </div>
    </div>

    <!-- Mentor Message Overlay is now rendered by React (src/react/mentor/MentorOverlay.tsx) -->

    <!-- Replay Modal is now rendered by React (src/react/replay/ReplayModal.tsx) -->

    <!-- Stats & Achievements Modal is now rendered by React (src/react/stats/StatsModal.tsx) -->

    <!-- Achievement Toast is now rendered by React (src/react/toast/AchievementToast.tsx) -->

    <!-- Duo Result Modal is now rendered by React (src/react/duoresult/DuoResultModal.tsx) -->

    <!-- Teach Modal -->
    <div id="teach-modal">
        <div class="teach-panel">
            <h2 class="teach-title" id="teach-title"></h2>
            <p class="teach-subtitle" id="teach-subtitle"></p>
            <div class="teach-explanation" id="teach-explanation"></div>
            <div class="teach-board" id="teach-board"></div>
            <div class="teach-step-text" id="teach-step-text"></div>
            <div class="teach-nav">
                <button id="teach-prev-btn" onclick="teachPrev()">← 上一步</button>
                <span id="teach-step-indicator">1/3</span>
                <button id="teach-next-btn" onclick="teachNext()">下一步 →</button>
            </div>
            <div class="teach-actions">
                <button class="teach-done-btn teach-skip-btn" onclick="hideTeachModal()">先跳過</button>
                <button class="teach-done-btn" id="teach-practice-btn" onclick="startPractice()">馬上練習 →</button>
            </div>
        </div>
    </div>

    <!-- Practice Modal -->
    <div id="practice-modal">
        <div class="practice-panel" id="practice-panel">
            <div class="practice-header">
                <span class="practice-tech-name" id="practice-tech-name"></span>
                <span class="practice-instruction">點擊要消去的候選數</span>
            </div>
            <div class="practice-board" id="practice-board"></div>
            <div class="practice-status">
                <span id="practice-counter">已選 0 個</span>
                <button onclick="showPracticeHint()">💡 提示</button>
            </div>
            <div class="practice-result" id="practice-result"></div>
            <div class="practice-actions" id="practice-actions">
                <button class="practice-confirm-btn" onclick="confirmPractice()">確認消去</button>
                <button class="practice-reveal-btn" onclick="revealPracticeAnswer()">看答案</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script>
      // Keep an inline version marker only; reload/update logic is centralized in src/pwa/swUpdate.ts.
      (function() {
        var INLINE_VER = '2026.04.04-V14';
        var KEY = 'sudoku_inline_ver';
        try {
          localStorage.setItem(KEY, INLINE_VER);
        } catch(e) {}
      })();
    </script>
    <!-- Level data now lazy-loads via public/data/*.json shards -->
    <!-- Legacy fallback levels.js removed: app now uses shard loader only -->
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
