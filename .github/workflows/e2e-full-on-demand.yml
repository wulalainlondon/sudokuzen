name: E2E Full On Demand

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      include_long_live:
        description: 'Run long/live suites (duo-sync + world-playthrough)'
        required: false
        type: boolean
        default: false

jobs:
  e2e-full:
    permissions:
      contents: read
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run Full E2E
        env:
          E2E_LIVE_FIREBASE: ${{ github.event_name == 'workflow_dispatch' && inputs.include_long_live && '1' || '' }}
          E2E_LONG_WORLD: ${{ github.event_name == 'workflow_dispatch' && inputs.include_long_live && '1' || '' }}
        run: npm run test:e2e -- --reporter=line

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full-e2e
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-full-e2e
          path: test-results
          if-no-files-found: ignore
