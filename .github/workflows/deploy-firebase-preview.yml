name: Deploy Firebase Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy_preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Create Firebase config
        run: |
          cat > public/firebase-config.js << 'ENDOFCONFIG'
          window.SUDOKU_FIREBASE_CONFIG = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "sudokuzen-f2aa3.firebaseapp.com",
            projectId: "sudokuzen-f2aa3",
            storageBucket: "sudokuzen-f2aa3.firebasestorage.app",
            messagingSenderId: "123072021375",
            appId: "1:123072021375:web:a7cee11c8bd7f6dffd904a"
          };
          ENDOFCONFIG

      - name: Build
        env:
          DEPLOY_TARGET: firebase
        run: npm run build

      - name: Prepare Dist
        run: node scripts/prepare-pages-dist.mjs

      - name: Deploy to Firebase Hosting Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sudokuzen-f2aa3
          channelId: web-preview
          expires: 30d
