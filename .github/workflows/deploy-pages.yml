name: Deploy GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Create Firebase config
        run: |
          cat > public/firebase-config.js << 'ENDOFCONFIG'
          window.SUDOKU_FIREBASE_CONFIG = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "sudokuzen-f2aa3.firebaseapp.com",
            projectId: "sudokuzen-f2aa3",
            storageBucket: "sudokuzen-f2aa3.firebasestorage.app",
            messagingSenderId: "123072021375",
            appId: "1:123072021375:web:a7cee11c8bd7f6dffd904a"
          };
          ENDOFCONFIG

      - name: Build
        env:
          DEPLOY_TARGET: github-pages
        run: npm run build

      - name: Prepare Dist For Pages
        run: node scripts/prepare-pages-dist.mjs

      - name: Verify Build Output
        run: |
          ENTRY=$(grep -oE 'src="/sudokuzen/assets/index-[^"]+\.js"' dist/index.html | head -1 | cut -d'"' -f2)
          BUNDLE="dist/${ENTRY#/sudokuzen/}"
          if [ -z "$ENTRY" ] || [ ! -f "$BUNDLE" ]; then
            echo "ERROR: Could not resolve the main JavaScript entry from dist/index.html"
            exit 1
          fi
          SIZE=$(wc -c < "$BUNDLE")
          echo "Bundle: $BUNDLE ($SIZE bytes)"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: Main bundle too small ($SIZE bytes), expected at least 100KB"
            exit 1
          fi
          echo "Bundle size OK"

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Smoke Test (boot + main thread responsive)
        run: node scripts/smoke-test-dist.mjs --base=/sudokuzen

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
