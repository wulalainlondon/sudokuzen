name: Deploy GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        env:
          DEPLOY_TARGET: github-pages
        run: npm run build

      - name: Prepare Dist For Pages
        run: node scripts/prepare-pages-dist.mjs

      - name: Verify Build Output
        run: |
          BUNDLE=$(ls dist/assets/index-*.js 2>/dev/null | head -1)
          SIZE=$(wc -c < "$BUNDLE")
          echo "Bundle: $BUNDLE ($SIZE bytes)"
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: Bundle too small ($SIZE bytes), expected 400KB+"
            exit 1
          fi
          echo "Bundle size OK"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
