name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ tests/

      - name: Prettier
        run: npx prettier --check 'src/**/*.{ts,tsx}' 'tests/**/*.ts'

      - name: Unit Tests
        run: npx vitest run

      - name: Build
        run: npm run build
