name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  duo-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: duo-party
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: duo-party/package-lock.json

      - run: npm ci

      - name: Durable Object checks and reconnect regression
        run: npm run check

  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ tests/

      - name: Prettier
        run: npx prettier --check 'src/**/*.{ts,tsx}' 'tests/**/*.ts'

      - name: Unit Tests
        run: npx vitest run

      - name: Create Firebase build config
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config = {
            apiKey: process.env.FIREBASE_API_KEY || 'ci-build-placeholder',
            authDomain: 'sudokuzen-f2aa3.firebaseapp.com',
            projectId: 'sudokuzen-f2aa3',
            storageBucket: 'sudokuzen-f2aa3.firebasestorage.app',
            messagingSenderId: '123072021375',
            appId: '1:123072021375:web:a7cee11c8bd7f6dffd904a',
          };
          fs.writeFileSync('public/firebase-config.js', `window.SUDOKU_FIREBASE_CONFIG = ${JSON.stringify(config)};\n`);
          JS

      - name: Build
        run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: E2E Smoke Gate
        run: npm run test:e2e:smoke -- --reporter=line
