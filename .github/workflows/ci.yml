name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src/ tests/

      - name: Prettier
        run: npx prettier --check 'src/**/*.{ts,tsx}' 'tests/**/*.ts'

      - name: Unit Tests
        run: npx vitest run

      - name: Build
        run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: E2E Smoke Gate
        run: npm run test:e2e:smoke -- --reporter=line
