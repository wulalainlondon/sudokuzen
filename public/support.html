  <body>
    <main>
      <h1>SudokuZen 支援</h1>
      <div class="card">
        <strong>需要協助？</strong>
        <p>請來信 <a href="mailto:wulalainlondon@gmail.com?subject=SudokuZen%20Support">wulalainlondon@gmail.com</a>，並附上 App 版本、裝置型號、問題發生步驟與截圖。</p>
      </div>
      <h2>資料刪除</h2>
      <p>請優先在 App「設定」中使用「刪除所有玩家資料」。若無法開啟 App，可來信並提供玩家暱稱與約略使用時間；我們會協助確認可處理的資料。</p>
      <h2>檢舉不當內容</h2>
      <p>如發現不當玩家暱稱或對戰行為，請提供暱稱、房間資訊、發生時間與截圖。我們會查核並採取必要措施。</p>
      <h2>隱私</h2>
      <p>請參閱 <a href="privacy.html">隱私權政策</a>。</p>
      <h2>內容來源與授權</h2>
      <p>第三方題庫來源與授權資訊請參閱 <a href="credits.html">內容來源與授權</a>。</p>
    </main>
